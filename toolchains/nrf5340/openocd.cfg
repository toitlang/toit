# FT2232H: AD0 -> SWDCLK; AD1 via 470 ohms and AD2 directly -> SWDIO.
# Application-core development target. Opt in to a separate network flash bank.
# The recovery runner alone opts into an application UICR bank.
adapter driver ftdi
adapter usb vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
ftdi layout_signal SWD_EN -data 0
transport select swd
adapter speed 1000
reset_config none
bindto 127.0.0.1
gdb port disabled
if {![info exists TOIT_TCL_PORT]} {set TOIT_TCL_PORT 16666}
tcl port $TOIT_TCL_PORT
telnet port disabled
swd newdap nrf53 cpu -expected-id 0x6ba02477
dap create nrf53.dap -tap nrf53.cpu
target create nrf53.cpuapp cortex_m -dap nrf53.dap -ap-num 0
set _TOIT_BACKUP_RAM 1
if {[info exists TOIT_FLASH_DISCARD_RAM] && $TOIT_FLASH_DISCARD_RAM} {
  # A reset-and-flash operation does not preserve the old VM's RAM. Avoid
  # the flash loader's large SWD backup reads on the FT2232H adapter.
  set _TOIT_BACKUP_RAM 0
}
nrf53.cpuapp configure -work-area-phys 0x20000000 -work-area-size 0x8000 -work-area-backup $_TOIT_BACKUP_RAM
nrf53.cpuapp cortex_m reset_config sysresetreq
flash bank nrf53.application nrf5 0 0 0 0 nrf53.cpuapp
if {[info exists TOIT_RECOVERY] && $TOIT_RECOVERY} {
  flash bank nrf53.application_uicr nrf5 0x00ff8000 0 0 0 nrf53.cpuapp
}
if {[info exists TOIT_NETWORK_CORE] && $TOIT_NETWORK_CORE} {
  target create nrf53.cpunet cortex_m -dap nrf53.dap -ap-num 1 -defer-examine
  nrf53.cpunet configure -work-area-phys 0x21000000 -work-area-size 0x4000 -work-area-backup $_TOIT_BACKUP_RAM
  nrf53.cpunet cortex_m reset_config sysresetreq
  if {([info exists TOIT_RECOVERY] && $TOIT_RECOVERY) ||
      ([info exists TOIT_FLASH_NETWORK] && $TOIT_FLASH_NETWORK)} {
    # An application reset holds the network core off. The owning flash or
    # recovery tool releases it explicitly while the application is halted.
    nrf53.cpunet configure -event reset-assert {;}
  }
  flash bank nrf53.network nrf5 0x01000000 0 0 0 nrf53.cpunet
  targets nrf53.cpuapp
}
init
