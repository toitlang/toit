CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_MAIN_STACK_SIZE=16384
# Includes dynamically allocated VM, event, and peripheral-worker stacks.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_THREAD_NAME=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_GPIO_GET_CONFIG=y
CONFIG_PM_DEVICE=y
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_ASYNC_API=y
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=500
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_DYNAMIC_CS=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_USE_DT_CODE_PARTITION=y
# The replaceable Toit extension must be the final bytes of the flash image.
CONFIG_LINKER_LAST_SECTION_ID=n
