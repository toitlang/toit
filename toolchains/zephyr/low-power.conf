# Requires a populated 32.768 kHz crystal. Use with low-power.overlay after
# checking the board's crystal and DC/DC components.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# Conservative accuracy; tighten only to match the fitted crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_TICKLESS_KERNEL=y
