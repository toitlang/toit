CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_DEVICE_NAME="Toit nRF5340"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
# Negotiate 247-byte ATT packets when the peer supports them. The extra
# four receive bytes hold the L2CAP header; the controller may fragment on air.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Use HCI LE Encrypt/Rand supplied by the network-core controller, avoiding
# a second, incompatible Mbed TLS library alongside Toit's existing library.
CONFIG_BT_HOST_CRYPTO=n
CONFIG_IPC_SERVICE=y
# HCI transport hooks own the network core's lifetime.
CONFIG_SOC_NRF53_CPUNET_ENABLE=n
