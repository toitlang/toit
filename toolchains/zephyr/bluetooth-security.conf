# Append after bluetooth.conf and settings.conf. Enables Secure Connections
# Just Works pairing and persistent bonds in both roles, without a passkey UI.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_CUSTOM=y
CONFIG_TOIT_PSA_CRYPTO=y
CONFIG_PSA_CSPRNG_GENERATOR=y
CONFIG_BT_HOST_CRYPTO=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_SETTINGS=y
CONFIG_TOIT_BLE_SECURITY=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_BONDABLE=n
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
