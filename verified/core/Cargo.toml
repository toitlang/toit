[package]
name = "toit_verified_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Linked into the VM through verified/vmverify (one Rust static library).
crate-type = ["rlib"]

[dependencies]
# Without vstd's default `std` feature: the core is `no_std` + alloc.
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false, features = ["alloc"] }
# The specification the core is proven against (ghost only: the run loop
# links none of its code; Verus imports its exported metadata). Without the
# spec's `std` (the core is `no_std`) and `infer` features: the inference is
# linked only where a crate asks for it (verified/vmverify's `infer`, hosts).
toit_spec = { path = "../spec", default-features = false }

[features]
default = ["checked-loop", "layout-tables"]
# The checked run loop (`machine::run_checked`): runs programs the verifier
# did not accept (unverified trusted format-2 programs on hosts). Devices
# build without it (verified/vmverify `checked-loop`; OBLIGATIONS.md has
# the cfg request for machine.rs). Verus verifies with it (check.sh).
checked-loop = []
# The layout check's tables (`toit_vcore_layout_*`, `toit_vcore_prim_*`,
# `toit_vcore_opcode_length`; verified/layout_check.cc, hosts only). Devices
# build without them (OBLIGATIONS.md has the cfg request for ffi.rs).
layout-tables = []
# `preempt-a-lot`: the debug flag `-Xpreempt_a_lot` (preempt after every POP).
# Only debug VM builds (TOIT_DEBUG) have it, as the C++ interpreter, whose
# release builds compile the test away; Verus verifies with it (check.sh).
preempt-a-lot = []
# `split-loop`: the run loop is split into a hot part (`step::run_loop`,
# IRAM on the classic ESP32) and a cold part (`step::step_cold`, the
# opcodes of `step::cold_op`, out of line). Without it every handler is in
# the loop and `step_cold` is not compiled. Kconfig
# TOIT_VERIFIED_CORE_SPLIT_LOOP (CMake TOIT_VERIFIED_CORE_SPLIT_LOOP);
# Verus verifies both configurations (check.sh).
split-loop = []

[package.metadata.verus]
verify = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = "line-tables-only"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
  'cfg(verus_keep_ghost)',
  'cfg(toit_vcore_hosted)',
] }
