[package]
name = "toit_verified_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Linked into the VM through verified/vmverify (one Rust static library).
crate-type = ["rlib"]

[dependencies]
# Without vstd's default `std` feature: the core is `no_std` + alloc.
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false, features = ["alloc"] }
# The specification the core is proven against (ghost only: the run loop
# links none of its code; Verus imports its exported metadata).
toit_spec = { path = "../spec", default-features = false }

[package.metadata.verus]
verify = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = "line-tables-only"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
  'cfg(verus_keep_ghost)',
  'cfg(toit_vcore_hosted)',
] }
