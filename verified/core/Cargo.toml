[package]
name = "toit_verified_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = "line-tables-only"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
  'cfg(verus_keep_ghost)',
  'cfg(toit_vcore_hosted)',
] }
