# The layout facts of the VM's objects, written once, per object kind:
# the facts both proofs rely on, the Verus heap model (verified/core/src/
# layout.rs, read through view.rs) and the VeriFast object model
# (verified/cxx/annotated/model: its predicates and renderings use the
# names of constants.h). verified/tools/layout_table.toit checks
#   * every `verus` name against the constant of layout.rs (both widths),
#   * every `verifast` name against the macro of constants.h and every
#     `cxx` expression against the C++ headers, by generating static
#     assertions (verified/cxx/annotated/model/layout.gen.constants.cc),
#     compiled for x86_64 and i686 by verified/cxx/annotated/constants-check.sh.
# So a fact changed in the C++, in layout.rs or in constants.h fails until
# this table, and the other side, follow.
#
# Fields: kind (the object kind), name (the fact), value64, value32 (the
# value on a 64-bit and a 32-bit target), cxx (a C++ expression inside
# namespace toit, access control off), verus (a layout.rs constant, or
# absent), verifast (a constants.h macro, or absent), note.

[[fact]]
kind = "word"
name = "word size in bytes"
value64 = 8
value32 = 4
cxx = "WORD_SIZE"
verus = "WORD_SIZE"
verifast = "WORD_SIZE"

