# The retry obligation of the C++ primitives ([[assumption]] prim_retry;
# README "The retry obligation", wave 7). When a primitive fails for want
# of memory (MALLOC_FAILED, ALLOCATION_FAILED, CROSS_PROCESS_GC), the VM
# collects garbage and calls it again, and the core takes the calls as ONE
# step (gc_call_primitive). That is a completion of the original step only
# if the failed call had no visible effect: no existing object written, no
# message sent or consumed, no resource, timer, notifier or finalizer
# registered, no malloced memory kept or freed (unreachable new objects are
# garbage the GC removes; so is a VM finalizer node whose object gave its
# memory back). Every C++ primitive an untrusted program can reach is
# classified here: directly (the 35 core, 2 bitmap, 7 timer and events
# primitives that stay C++) or through the Rust ports' declines (the 106
# core primitives ported to Rust call the C++ primitive when the port
# returns NeedsGc or NotPorted, which the core proves leave the machine
# unchanged: rarrays.rs rust_primitive_r, `res is None ==> *final(m) ==
# *old(m)`). contract_check.toit reads the untrusted set from the policy
# and fails on a primitive classified twice, not classified, or classified
# but not in the set; an (a) whose body allocates; a (b) "test" without a
# case in the ctest; a (b) "verifast" whose primitive's contract in the
# rendering does not state `oom_clean` or whose rendering is not a `pass`
# entry of cxx/annotated/run.sh; a (b) "review" without its argument; a
# (c) without its fix.
[prim_retry]
policy = "src/primitive_policy.cc"
test = "tests/ctest/prim-retry-test.cc"
sources = { core = "src/primitive_core.cc", bitmap = "src/primitive_bitmap.cc", timer = "src/resources/timer.cc", events = "src/primitive_events.cc" }
# (a) Cannot fail for want of memory: no allocation in the primitive (its
# body is checked for allocating calls, argument kinds and errors).
a = [
  "core.array_at", "core.array_at_put", "core.array_length", "core.array_replace",
  "core.blob_equals", "core.blob_hash_code", "core.blob_index_of",
  "core.byte_array_at", "core.byte_array_at_put", "core.byte_array_is_raw_bytes", "core.byte_array_length",
  "core.byte_array_is_valid_string_content",
  "core.compare_to", "core.min_special_compare_to", "core.count_leading_zeros", "core.popcount",
  "core.float_sign", "core.float_is_nan", "core.float_is_finite",
  "core.float_less_than", "core.float_less_than_or_equal", "core.float_greater_than",
  "core.float_greater_than_or_equal", "core.float_equals",
  "core.large_integer_equals", "core.large_integer_less_than", "core.large_integer_less_than_or_equal",
  "core.large_integer_greater_than", "core.large_integer_greater_than_or_equal",
  "core.smi_not", "core.smi_shift_right",
  "core.smi_less_than", "core.smi_less_than_or_equal", "core.smi_greater_than",
  "core.smi_greater_than_or_equal", "core.smi_equals",
  "core.list_add", "core.rebuild_hash_index", "core.int_vector_equals",
  "core.object_class_id", "core.process_current_id", "core.process_system_id",
  "core.random", "core.gc_count", "core.word_size", "core.spawn_method",
  "core.remove_finalizer", "core.task_transfer",
