side = "ensures"
name = "allocated"
bridge = "heap"
verus = ""
verifast = "[f]process(self, prog, ids) &*& [fc]uchars((uint8 *)content, length, cs) &*& allocated(objs, H, self, result, ?objs2, ?H2) &*& (result == 0 ? true : has_tag(H2, result, STRING_TAG) == true &*& blob_len(H2, result) == length)"

[[contract]]
name = "allocate_array"
verus_file = ""
verus_fn = ""
cxx_fn = "ObjectHeap_allocate_array"
rendering = "cxx/annotated/model/objects.gen.h"
