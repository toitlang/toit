# The leaf contracts between the Verus proof (verified/core) and the C++
# it calls, written once, with both renderings: the clauses of the Verus
# external_body function and the conjuncts of the VeriFast contract of the
# C++ function (verified/cxx/annotated). verified/tools/contract_check.toit
# (run by verified/check.sh) compares each side with its source: the
# requires/ensures clauses of the Verus function, in order, and the
# requires/ensures of the generated rendering's prototype, conjunct by
# conjunct. A change on either side fails until this table, and with it the
# other side, is updated.
#
# Fields of a contract: the Verus function (file relative to verified/,
# name), the C++ function, its rendering (empty: not rendered; then only
# the Verus side is checked) and the status. Each clause (in order, per
# contract and side): a name, the Verus text, the VeriFast text (several
# conjuncts joined by &*& when the views differ in granularity), the bridge
# that relates them, and a note. "MISSING" marks a clause one side does not
# have: a known disagreement, reported by the checker (README "Findings").
#
# The two sides state the clauses over different views of the same state:
# Verus over the abstract heap of the spec (`reloaded(m, g).refines(p)`),
# VeriFast over separation-logic predicates of the words (`stack`,
# `current_stack`, `heap`). The bridges between them are written once,
# below. They are THE REMAINING REVIEWED ASSUMPTION of the seam: neither
# tool checks them.

[bridge]
stack = [
  "REVIEWED ASSUMPTION. For the current task's stack s with the Stack header",
  "words (length len, top top, record top rtop, frame top ft, finally count",
  "fin, bci) and the array bytes bs (VeriFast: current_stack(p, task, s) &*&",
  "stack(s, len, top, rtop, ft, fin, bci, bs) &*& stack_ok(len, top, rtop, bs)):",
  "reloaded(m, g) re-derives the machine's cached fields (length, top, frame",
  "top, bci, the top frame's base and method) from exactly these words, so",
  "reloaded(m, g).refines(p) depends on the stack only through (len - top,",
  "rtop, ft, fin, bci, take(rtop * W, bs), drop(top * W, bs)): the observables",
  "same_abstraction keeps. StackMem requires initialized words throughout",
  "the array. current_stack owns the object heap's current-task field and",
  "the native stack-pointer slot in that task. Both addresses may change across",
  "a collection or task switch. The VM predicate requires a TBC2 program.",
  "Format-2 stack allocation fills all slots with tagged zero;",
  "growth copies the live ranges into initialized storage. A VeriFast post-state with",
  "same_abstraction(old, new) refines g whenever the pre-state did. The rest",
  "of the machine state (heap, globals) is not touched by the rendered code;",
  "v2_gc obtains preservation of the abstraction from the Scheduler::gc contract.",
  "Since wave 6 the VeriFast side states this over the whole state at a GC",
  "point, vm(p, v, n) with v = vmv(stack object, len, top, rtop, ft, fin, bci,",
  "bytes, heap objects, H): vm_equiv(a, b) (a == b, or gc_equiv(a, b): what",
  "v2_gc guarantees) means that a refines g exactly when b does (the GC",
  "rewrites every root, the used slots among them, to the moved objects:",
  "not a byte-wise equality); stack_copy_equiv ([[assumption]]) is the",
  "paragraph above for a copied stack. heap_epoch owns ObjectHeap::v2_epoch_",
  "and its mathematical count n. Each native tick advances n and writes",
  "the new count modulo the word. An unchanged count excludes collection",
  "and task switches under the call bounds (TRUSTED.md, Epoch).",
]
primitive = [
  "REVIEWED ASSUMPTION. For the C++ primitive the policy resolves (module,",
  "index) to, fn = policy_fn(policy_of(p), module, index) (the table entry",
  "whose arity is the number of arguments fn reads), prim_out(fn, a, b, raw)",
  "on VM states a, b (stack bridge) is the spec's completion of the step:",
  "prim_call_post(p, m', g, module, index, status, word, gx, v) for the",
  "machine m' that b's views give, with the status and word prim_done",
  "derives from raw (SUCCESS: raw is the value; FAILURE: the unmarked error;",
  "THROW: an out-of-memory root after the retries). Each C++ primitive",
  "establishes prim_out by its own contract (TRUSTED.md section 8: the",
  "function type Primitive_Entry of cxx/annotated/ffi), and prim_retry",
  "([[assumption]]) composes a failed call, a GC and the retry.",
]
heap = [
  "REVIEWED ASSUMPTION. VeriFast's heap(objs, H) (verified/cxx/annotated/model)",
  "is the C side of TRUSTED.md V2: every object of the Verus abstract heap is",
  "a member of objs, with header, length and body words as H says, at the",
  "address (uword)o - 1; every reference word in a body is a smi or a member;",
  "the objects are distinct; a string or byte array holds its content inside",
  "the object or at its external address. Strings own a trailing NUL at their",
  "declared end (checked for images by from_vm.rs). An external byte array owns",
  "its bytes exactly when tagged RawByteTag (no two blobs share external",
  "bytes). Process::on_program_heap proves membership in the half-open range",
  "in_program_heap from the process program pointer and cached image length.",
  "The loader supplies a live image spanning the page count in its header.",
  "The layout constants of both are checked against the same C++ headers",
  "(verified/layout_check.cc for Rust, the *.gen.constants.cc of the",
  "renderings for VeriFast), 64- and 32-bit.",
]

# The named assumptions of the C++ proofs: bodiless lemmas of a rendering
# that VeriFast takes as axioms. contract_check.toit finds each one in its
# rendering, checks that it has no body and that its contract is the one
# written here (conjunct by conjunct), and fails on a bodiless lemma of a
# rendering's verbatim section that is not listed.
[[assumption]]
name = "two_pass_room"
rendering = "cxx/annotated/encoder/message_encoder.gen.c"
requires = "[?f1]e->buffer_ |-> ?b &*& [?f2]enc_buf(b, ?cap) &*& [?f3]e->cursor_ |-> ?c &*& 0 <= n"
ensures = "[f1]e->buffer_ |-> b &*& [f2]enc_buf(b, cap) &*& [f3]e->cursor_ |-> c &*& (b == 0 || c + n <= cap)"
note = "The message encoder's two passes: the write pass (a buffer of the size the size pass returned, on the same heap) writes no further than the size pass counted. README, 'The two-pass assumption'."

# The C++ side of the boundary (cxx/annotated/ffi, wave 6): the VM state
# is `vm(p, v, n)` (the current stack, its header fields and bytes, the
# heap, the epoch count n), and the GC's guarantee is `gc_equiv`, an
# uninterpreted relation with three named properties ([[assumption]]
# gc_equiv_trans, stack_copy_equiv, prim_retry below). Its bodiless lemmas
# are the C++ half of "where permissions come from".
[[assumption]]
name = "gc_equiv_trans"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
requires = "gc_equiv(a, b) == true &*& gc_equiv(b, c) == true"
ensures = "gc_equiv(a, c) == true"
note = "Two collections in a row preserve the abstraction (the GC's relation composes). TRUSTED: GC-class code."

[[assumption]]
name = "stack_copy_equiv"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
requires = "a == vmv(?s, ?len, ?top, ?rtop, ?ft, ?fin, ?bci, ?bs, ?objs, ?H) &*& same_abstraction(len, top, rtop, bs, len2, top2, rtop, bs2) == true"
ensures = "vm_equiv(a, vmv(s2, len2, top2, rtop, ft, fin, bci, bs2, objs, H)) == true"
note = "The `stack` bridge as a lemma: a stack copied with the same observables (records, header fields, used slots by position from the end) represents the same state; which object holds them is not observable (the core re-reads the current stack). Used by stack growth after Stack::v2_copy_to."

[[assumption]]
name = "prim_retry"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
requires = "prim_out(fn, a, b, e) == true &*& oom_error(prog, e) == true &*& vm_equiv(b, b2) == true &*& prim_out(fn, b2, c, r) == true"
ensures = "prim_out(fn, a, c, r) == true"
note = "The retry protocol of the C++ primitives (v2_primitive_failed, as Interpreter::run's): a call that failed for want of memory has no effect the spec sees, so the call after the GC is a completion of the original step. TRUSTED per primitive (TRUSTED.md section 8): each must allocate before it changes anything visible. Not stated on the Verus side, where gc_call_primitive's completion clause covers the whole C++ call: an assumption the C++ wrapper alone does not establish (README, wave 6)."

[[contract]]
name = "gc_grow_stack"
verus_file = "core/src/step.rs"
verus_fn = "gc_grow_stack"
cxx_fn = "toit_v2_grow_stack"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32); the C++ checks the bound on needed itself; since wave 6 over the GC-aware state (vm, vm_equiv)"

[[clause]]
contract = "gc_grow_stack"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"
verifast = "vm((Process *)raw_process, ?a, ?n)"

[[clause]]
contract = "gc_grow_stack"
side = "requires"
name = "needed bound"
verus = "needed < GROW_STACK_MAX_NEEDED"
note = "Not in the VeriFast contract, and not needed there: the C++ returns STACK_OVERFLOW for needed > Stack::max_length() before converting needed to word (a weaker precondition on the C++ side is sound). Without that check the cast to word and the sum overflow: mutants grow-stack-unbounded, grow-stack-word-range."

[[clause]]
contract = "gc_grow_stack"
side = "ensures"
name = "views"
bridge = "stack"
verus = "reloaded(*final(m), g).refines(&env.p)"
verifast = "vm((Process *)raw_process, ?b, ?n2) &*& vm_equiv(a, b) == true &*& n <= n2"
note = "Before wave 6 the VeriFast side said the used slots were byte for byte the same after a GC (`same_abstraction`): false for a moving GC, which rewrites every reference slot; the trusted v2_gc contract claimed it. Now the GC's guarantee is gc_equiv (the abstraction is the same), which the core's re-derivation relies on."

[[clause]]
contract = "gc_grow_stack"
side = "ensures"
name = "room"
verus = "r == V2_OK ==> reloaded(*final(m), g).top - reloaded(*final(m), g).rtop >= needed"
verifast = "(result == TOIT_V2_OK ? v_top(b) - v_rtop(b) >= needed : result == TOIT_V2_STACK_OVERFLOW || result == TOIT_V2_OUT_OF_MEMORY)"

[[contract]]
name = "gc_allocate_instance"
verus_file = "core/src/alloc.rs"
verus_fn = "gc_allocate_instance"
cxx_fn = "toit_v2_allocate_instance"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32; wave 6): the lambda and the v2_allocate instance (closure rules), at most three collections, the epoch"

[[clause]]
contract = "gc_allocate_instance"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"
verifast = "[?fp]process((Process *)raw_process, ?prog, ?ids) &*& vm((Process *)raw_process, ?a, ?n)"

[[clause]]
contract = "gc_allocate_instance"
side = "requires"
name = "class"
verus = "c < env.p.ap@.class_bits.len()"
verifast = "class_id < 1024"
note = "A bound of the VeriFast model (header_ok: class ids below 1024), not of the C++, which takes any class id of the program; the Verus side bounds it by the program's class count. A gap for programs with more than 1024 classes (README, wave 6)."

[[clause]]
contract = "gc_allocate_instance"
side = "requires"
name = "instance class"
verus = "class_tag(p1(env.p.ap@), c as int) == INSTANCE_TAG"
verifast = "class_tag(class_id) == INSTANCE_TAG"

[[clause]]
contract = "gc_allocate_instance"
side = "requires"
name = "field count"
verus = "instance_field_count(p1(env.p.ap@), c as int) >= 0"

[[clause]]
contract = "gc_allocate_instance"
side = "ensures"
name = "out of memory"
bridge = "stack"
verus = "r.0 == 0 ==> reloaded(*final(m), g).refines(&env.p)"
verifast = "[fp]process((Process *)raw_process, prog, ids) &*& vm((Process *)raw_process, ?b, ?n2) &*& alloc_post((Process *)raw_process, a, n, b, n2, ?r, ?objsm, ?Hm) &*& result == (uword)r"
note = "alloc_post: the state before the allocation is a's after the GCs (vm_equiv), with the null result nothing else; the result word is the object's address (0 for null: a non-null object has addr_ok)."

[[clause]]
contract = "gc_allocate_instance"
side = "ensures"
name = "appended"
bridge = "heap"
verus = "r.0 != 0 ==> reloaded(*final(m), sp::alloc2(g, new_instance(env.p.ap@, c as int))).refines(&env.p) && r.0 == enc(final(m).addr(), sp::new_ref2(g))"
verifast = "(r == 0 ? true : instance_new(v_H(b), r, class_id) == true)"
note = "With alloc_post's other branch (r appended to the heap of the state before, outside the program heap, every other object unchanged). The fields' value (null) is the allocator's, outside the model's contract of ObjectHeap::allocate_instance (src/heap.cc writes the null object): a gap of the VeriFast side."

[[clause]]
contract = "gc_allocate_instance"
side = "ensures"
name = "epoch"
verus = "!r.1 ==> crate::primitive::unmoved(*final(m), *old(m))"
note = "The epoch contract (TRUSTED.md, Epoch): when the C++ reports no GC, nothing moved. VeriFast: in alloc_post, `epoch_word(n2) == epoch_word(n) ? with_heap(b, objsm, Hm) == a`: the epoch word the core compares is unchanged only if no collection ran, because v2_allocate collects at most three times (the loop bound; mutant ffi-allocate-retries) and each collection moves the count by at most one."

[[contract]]
name = "gc_allocate_double"
verus_file = "core/src/alloc.rs"
verus_fn = "gc_allocate_double"
cxx_fn = "toit_v2_allocate_double"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32; wave 6), as gc_allocate_instance"

[[clause]]
contract = "gc_allocate_double"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"
verifast = "[?fp]process((Process *)raw_process, ?prog, ?ids) &*& vm((Process *)raw_process, ?a, ?n)"

[[clause]]
contract = "gc_allocate_double"
side = "ensures"
name = "out of memory"
bridge = "stack"
verus = "r.0 == 0 ==> reloaded(*final(m), g).refines(&env.p)"
verifast = "[fp]process((Process *)raw_process, prog, ids) &*& vm((Process *)raw_process, ?b, ?n2) &*& alloc_post((Process *)raw_process, a, n, b, n2, ?r, ?objsm, ?Hm) &*& result == (uword)r"

[[clause]]
contract = "gc_allocate_double"
side = "ensures"
name = "appended"
bridge = "heap"
verus = "r.0 != 0 ==> reloaded(*final(m), sp::alloc2(g, new_double(as1(g), p1(env.p.ap@), bits))).refines(&env.p) && r.0 == enc(final(m).addr(), sp::new_ref2(g))"
verifast = "(r == 0 ? true : has_tag(v_H(b), r, DOUBLE_TAG) == true)"
note = "The payload (the bits) is outside the VeriFast heap model (a double's body is its header only): the C++ converts the bits with bit_cast<double> (a memcpy) and passes the double by value to the allocator, which stores it. Whether a signaling NaN keeps its bits through a double value C leaves to the implementation; review: no x87 on this path (host32 builds with -msse2 -mfpmath=sse, arguments go through memory; ESP32 has no FPU for doubles)."

[[clause]]
contract = "gc_allocate_double"
side = "ensures"
name = "epoch"
verus = "!r.1 ==> crate::primitive::unmoved(*final(m), *old(m))"
note = "The epoch contract (TRUSTED.md, Epoch); in alloc_post, as gc_allocate_instance."

[[contract]]
name = "gc_allocate_exception"
verus_file = "core/src/raise.rs"
verus_fn = "gc_allocate_exception"
cxx_fn = "toit_v2_allocate_exception"
rendering = ""
status = "not rendered: the value word from Rust stored as an object (reinterpret_cast<Object*>(raw_value): no provenance in VeriFast's C model), the message words read as objects, and the trace encoder (encode_error)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "value"
verus = "value == enc(old(m).addr(), v)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "constant"
verus = "const_ok(g.heap, v)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "count"
verus = "count == vs.len()"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "message"
verus = "msg_ok(old(m).addr(), kind, ws@, vs)"

[[clause]]
contract = "gc_allocate_exception"
side = "ensures"
name = "raised"
bridge = "heap"
verus = "exists|h2: Seq<HeapObj>, trace: Value| #[trigger] exception_post(&env.p, *final(m), g, v, r, h2, trace)"

[[contract]]
name = "gc_call_primitive"
verus_file = "core/src/primitive.rs"
verus_fn = "gc_call_primitive"
cxx_fn = "toit_v2_primitive"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32; wave 6): toit_v2_primitive and v2_primitive_failed (the arity check, the arguments' address in the frame, the retry protocol with the stack re-read after each GC, at most three collections and four calls, the epoch); each primitive's own contract is the function type Primitive_Entry's (TRUSTED.md section 8)"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"
verifast = "[?fp]process((Process *)raw_process, ?prog, ?ids) &*& vm((Process *)raw_process, ?a, ?n) &*& *result_out |-> _"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "primitive step"
verus = "sp::step(env.p.ap@, g) == Outcome2::Primitive(g, module, index)"
verifast = "module < 256 &*& index < 65536"
note = "VeriFast: the module and index fit the policy's `unsigned` parameters (the Verus types u8, u16)."

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "first"
bridge = "stack"
verus = "first == sp::base(g)"
verifast = "first_argument < v_len(a) - v_top(a) + v_rtop(a)"
note = "The frame's first parameter is at most the object stack's height, and a running frame has a frame record below the slots (rtop > 0): its address is inside the stack array."

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "arity"
bridge = "stack"
verus = "arity == sp::frame_height(g)"
verifast = "first_argument + arity <= v_len(a) - v_top(a)"
note = "The frame's parameters are used object-stack slots. The C++ calls the primitive only when its table arity is this arity (mutant ffi-primitive-arity: without the check, a primitive reads past the frame)."

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "absent"
verus = "r.0 == V2_PRIMITIVE_ABSENT ==> *final(m) == *old(m)"
verifast = "[fp]process((Process *)raw_process, prog, ids) &*& vm((Process *)raw_process, ?b, ?n2) &*& (result == TOIT_V2_PRIMITIVE_ABSENT ? *result_out |-> _ &*& b == a &*& n2 == n &*& (policy_fn(policy_of((Process *)raw_process), module, index) == 0 || prim_arity(policy_fn(policy_of((Process *)raw_process), module, index)) != arity) : *result_out |-> ?w &*& prim_arity(policy_fn(policy_of((Process *)raw_process), module, index)) == arity &*& prim_done(prog, policy_fn(policy_of((Process *)raw_process), module, index), a, n, b, n2, result, w, ?raw))"
note = "One conditional for the three clauses: ABSENT (nothing ran) or prim_done (completion and epoch)."

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "completion"
bridge = "primitive"
verus = "r.0 != V2_PRIMITIVE_ABSENT ==> exists|gx: State2, v: Value| #[trigger] prim_call_post(&env.p, *final(m), g, module, index, r.0, r.1, gx, v) && (!r.2 ==> gx == with_heap2(g, gx.heap))"
note = "VeriFast: prim_done (in the conditional above): prim_out of the policy's function on a, from its last call `raw`, after the GCs (prim_retry), with the status and word the core gets: SUCCESS a value, FAILURE another error (unmarked), THROW an out-of-memory root after four calls."

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "epoch"
verus = "r.0 != V2_PRIMITIVE_ABSENT && !r.2 ==> unmoved(*final(m), *old(m))"
note = "The epoch contract (TRUSTED.md, Epoch): no GC, nothing moved. VeriFast: in prim_done, `epoch_word(n2) == epoch_word(n) ? same_stack(a, b)`: at most three collections and four calls (each at most PRIM_EPOCHS task switches), so an unchanged word is an unchanged count (mutant ffi-primitive-retries)."

# The allocation without a GC of the Rust primitives (ffi::Allocator,
# verified/core/src/ffi.rs; TRUSTED.md section 8, "Allocation without
# GC"): the C++ entries over the model's allocator.
[[contract]]
name = "allocator_large_integer"
verus_file = "core/src/ffi.rs"
verus_fn = "large_integer"
cxx_fn = "toit_v2_try_allocate_large_integer"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32; wave 6) over the allocator's contract"

[[clause]]
contract = "allocator_large_integer"
side = "requires"
name = "views"
bridge = "heap"
verus = ""
verifast = "[?fp]process((Process *)raw_process, ?prog, ?ids) &*& heap(?objs, ?H)"
note = "Verus: the views of the `&mut Heap`."

[[clause]]
contract = "allocator_large_integer"
side = "ensures"
name = "out of memory"
bridge = "heap"
verus = "r == 0 ==> *final(heap) == *old(heap)"
verifast = "[fp]process((Process *)raw_process, prog, ids) &*& allocated(objs, H, (Process *)raw_process, ?r, ?objs2, ?H2) &*& result == (uword)r"

[[clause]]
contract = "allocator_large_integer"
side = "ensures"
name = "appended"
bridge = "heap"
verus = "r != 0 ==> appended(old(heap), final(heap), r, p.ro_start, p.ro_size) && final(heap).objs().last() == (HeapObj { class_id: p.ap@.builtin[BUILTIN_LARGE_INTEGER as int], ro: false, body: Body::LargeInt(v) })"
verifast = "(r == 0 ? true : has_tag(H2, r, LARGE_INTEGER_TAG) == true &*& o_number(H2(r)) == value)"
note = "The VeriFast model tracks the payload and verifies the initializer and getter. The wrapper carries the exact signed payload through to the caller. ESBMC checks the native object's class, tag and payload given fresh raw storage or exhaustion. The allocator takes any value; the Rust callers allocate only outside the smi range (prims/ints.rs; canonical integers). Since wave 6 the model's allocator no longer requires that (the decoder's decode_integer ensures it)."

[[contract]]
name = "allocator_double"
verus_file = "core/src/ffi.rs"
verus_fn = "double"
cxx_fn = "toit_v2_try_allocate_double"
rendering = "cxx/annotated/ffi/interpreter_v2.gen.c"
status = "verified (VeriFast, LP64 and ILP32; wave 6) over the allocator's contract"

[[clause]]
contract = "allocator_double"
side = "requires"
name = "views"
