side = "ensures"
name = "appended"
bridge = "heap"
verus = "r.0 != 0 ==> reloaded(*final(m), sp::alloc2(g, new_double(as1(g), p1(env.p.ap@), bits))).refines(&env.p) && r.0 == enc(final(m).addr(), sp::new_ref2(g))"

[[clause]]
contract = "gc_allocate_double"
side = "ensures"
name = "epoch"
verus = "!r.1 ==> crate::primitive::unmoved(*final(m), *old(m))"
note = "The epoch contract (TRUSTED.md, Epoch)."

[[contract]]
name = "gc_allocate_exception"
verus_file = "core/src/raise.rs"
verus_fn = "gc_allocate_exception"
cxx_fn = "toit_v2_allocate_exception"
rendering = ""
status = "not rendered: allocation through v2_allocate and the trace encoder (encode_error)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "value"
verus = "value == enc(old(m).addr(), v)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "constant"
verus = "const_ok(g.heap, v)"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "count"
verus = "count == vs.len()"

[[clause]]
contract = "gc_allocate_exception"
side = "requires"
name = "message"
verus = "msg_ok(old(m).addr(), kind, ws@, vs)"

[[clause]]
contract = "gc_allocate_exception"
side = "ensures"
name = "raised"
bridge = "heap"
verus = "exists|h2: Seq<HeapObj>, trace: Value| #[trigger] exception_post(&env.p, *final(m), g, v, r, h2, trace)"

[[contract]]
name = "gc_call_primitive"
verus_file = "core/src/primitive.rs"
verus_fn = "gc_call_primitive"
cxx_fn = "toit_v2_call_primitive"
rendering = ""
status = "not rendered: the retry loop around the primitive entry and the GC; the primitives are per-primitive contracts (TRUSTED.md section 8)"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "views"
bridge = "stack"
verus = "reloaded(*old(m), g).refines(&env.p)"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "primitive step"
verus = "sp::step(env.p.ap@, g) == Outcome2::Primitive(g, module, index)"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "first"
verus = "first == sp::base(g)"

[[clause]]
contract = "gc_call_primitive"
side = "requires"
name = "arity"
verus = "arity == sp::frame_height(g)"

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "absent"
verus = "r.0 == V2_PRIMITIVE_ABSENT ==> *final(m) == *old(m)"

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "completion"
bridge = "heap"
verus = "r.0 != V2_PRIMITIVE_ABSENT ==> exists|gx: State2, v: Value| #[trigger] prim_call_post(&env.p, *final(m), g, module, index, r.0, r.1, gx, v) && (!r.2 ==> gx == with_heap2(g, gx.heap))"

[[clause]]
contract = "gc_call_primitive"
side = "ensures"
name = "epoch"
verus = "r.0 != V2_PRIMITIVE_ABSENT && !r.2 ==> unmoved(*final(m), *old(m))"
note = "The epoch contract (TRUSTED.md, Epoch): no GC, nothing moved."

# The decoder's assumptions (verified/cxx/annotated/decoder): the
# inter-process path only (TISON, the untrusted input, needs neither).
[[assumption]]
name = "ipc_room"
rendering = "cxx/annotated/decoder/message_decoder.gen.c"
requires = "[_]ipc_msg(d, ?b, ?cap) &*& [?f]d->cursor_ |-> ?c &*& 0 <= n"
ensures = "[f]d->cursor_ |-> c &*& c + n <= cap"
note = "An inter-process message is the encoder's output, decoded once in the process it was sent to: every read of the decoder lies in the message (the decoder decides as the encoder did). README, 'The decoder's assumptions'."

[[assumption]]
name = "ipc_external"
rendering = "cxx/annotated/decoder/message_decoder.gen.c"
requires = "[_]ipc_msg(d, ?b, ?cap) &*& [?f]d->cursor_ |-> ?c"
ensures = "[f]d->cursor_ |-> c &*& msg_block(data, length) &*& 0 <= length &*& length < MAX_BLOB"
note = "An out-of-line pointer of a message is a block the message owns, of the length written before it, read once: the decoded object takes it (or, when the allocation fails, the message keeps it). README, 'The decoder's assumptions'."

# The allocator and the field writes the renderings use (C++ calling C++:
# no Verus side). The allocations are contracts only (TRUSTED.md V2, the
# `heap` bridge): a new object of the stated kind outside the program heap,
# the other objects unchanged, or null and nothing changed. The writes are
# rendered and verified (model/objects.render).
[[contract]]
name = "allocate_string"
verus_file = ""
verus_fn = ""
cxx_fn = "Process_allocate_string__charp_word"
rendering = "cxx/annotated/model/objects.gen.h"
status = "contract only (the allocator); used by the message decoder"

[[clause]]
contract = "allocate_string"
side = "requires"
name = "views"
bridge = "heap"
verus = ""
verifast = "[?f]process(self, ?prog, ?ids) &*& heap(?objs, ?H)"

[[clause]]
contract = "allocate_string"
side = "requires"
name = "content"
verus = ""
verifast = "[?fc]uchars((uint8 *)content, length, ?cs) &*& 0 <= length &*& length <= MAX_BLOB"

[[clause]]
contract = "allocate_string"
side = "ensures"
name = "allocated"
bridge = "heap"
verus = ""
verifast = "[f]process(self, prog, ids) &*& [fc]uchars((uint8 *)content, length, cs) &*& allocated(objs, H, self, result, ?objs2, ?H2) &*& (result == 0 ? true : has_tag(H2, result, STRING_TAG) == true &*& blob_len(H2, result) == length)"

[[contract]]
name = "allocate_array"
verus_file = ""
verus_fn = ""
cxx_fn = "ObjectHeap_allocate_array"
rendering = "cxx/annotated/model/objects.gen.h"
status = "contract only (the allocator); used by the message decoder"

[[clause]]
contract = "allocate_array"
side = "requires"
name = "views"
bridge = "heap"
verus = ""
verifast = "[_]object_heap(self, ?p) &*& [?f]process(p, ?prog, ?ids) &*& heap(?objs, ?H)"

[[clause]]
