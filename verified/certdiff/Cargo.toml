# certdiff: host-only test and measurement tool for the shipped-certificate
# checker (src/main.rs). Plain Rust: not built by the VM, not part of the
# verification epoch, not audited, never linked into a device. Derived
# from the format-3 study's harness (branch study/format3).

[package]
name = "toit_certdiff"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "certdiff"
path = "src/main.rs"

[dependencies]
toit_spec = { path = "../spec", default-features = false, features = ["std", "infer"] }
toit_vmverify = { path = "../vmverify", default-features = false, features = ["std", "infer"] }
toit_verified_core = { path = "../core", default-features = false }

[profile.release]
panic = "unwind"
opt-level = 3
debug = "line-tables-only"
