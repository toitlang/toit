# A C entry point around the collector, with the page source behind
# extern functions: the shape of the M5 FFI. Built by ../check.sh only to
# show that the collector links no panic machinery on a device target and
# to measure its code size. Not linked into the VM.

[package]
name = "toit_gc_nopanic"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
toit_gc = { path = ".." }
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false }

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
debug = false

[profile.dev]
panic = "abort"
