# The proved copying collector for sandboxed processes (README.md): a
# page-granular Cheney copy in Rust, verified with Verus (check.sh).
# Not linked into the VM yet (milestone M5).

[package]
name = "toit_gc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = false
debug = false

[profile.dev]
panic = "abort"
