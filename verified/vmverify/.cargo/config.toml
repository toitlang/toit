#
# Code generation of the VM's Rust library (this crate contains the
# verified core; CMake runs cargo from this directory). Larger tail
# duplication lets LLVM copy the run loop's dispatch (bci load, opcode
# fetch, jump table) into the handlers instead of jumping back to one shared
# dispatch block: 2 dispatch sites -> 40, and 3-5 percent fewer
# instructions on richards, deltablue and pystone (verified/core/DESIGN.md,
# section 8, performance pass). No effect on the proofs (Verus does not use
# this file).
[build]
rustflags = ["-C", "llvm-args=-tail-dup-size=12", "-C", "llvm-args=-vectorize-slp=false"]

# The EC618 (Cortex-M3): one image runs from either flash slot, and the
# slot relocator (tools/ec618/gen-slot-reloc.toit, src/slot_reloc_ec618.cc)
# moves 32-bit words (R_ARM_ABS32) and branches to the base, not movw/movt
# pairs. LLVM loads addresses with movw/movt on v7-M (switch tables, for
# example), so the core takes them from literal pools, as GCC does for the C++
# side (docs/format2-migration.md, "EC618"). A target's rustflags replace
# [build] rustflags, so the two flags above are repeated.
[target.thumbv7m-none-eabi]
rustflags = ["-C", "llvm-args=-tail-dup-size=12", "-C", "llvm-args=-vectorize-slp=false", "-C", "target-feature=+no-movt"]
