# The format-2 verifier as the VM runs it at untrusted launch, and the one
# Rust static library the VM links (it contains the verified core too, so
# that the binary has a single Rust runtime). See README.md.

[package]
name = "toit_vmverify"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "toit_vmverify_canonical"
path = "src/bin/toit_vmverify_canonical.rs"
required-features = ["std"]

[[bin]]
name = "toit_vmverify_mem"
path = "src/bin/toit_vmverify_mem.rs"
required-features = ["std"]

[[bin]]
name = "toit_vmverify_fuzz"
path = "src/bin/toit_vmverify_fuzz.rs"
required-features = ["std"]

[features]
# `std`: hosts (panics are caught and reject, phase times, counting
# allocator, test support). Without it: `no_std` + `alloc` for devices.
default = ["std"]
std = ["toit_spec/std"]
# Devices: the global allocator and the panic handler the VM supplies
# (src/device.rs: malloc/free, toit_vmverify_panic). Use without `std`, for
# the static library linked into device firmware (profile `device`).
device-runtime = []

[dependencies]
toit_spec = { path = "../spec", default-features = false }
toit_verified_core = { path = "../core" }

# This crate's profiles are the ones used when the VM's static library is
# built (the core's own profiles only apply to its standalone builds).
# panic = "unwind" (the core alone uses "abort"): the verifier runs on
# untrusted input inside the VM, and a panic of the (untrusted) inference
# must reject the program, not abort the VM (ffi.rs, catch_unwind). The
# core's handlers do not panic; README.md has the run-loop measurement.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
debug = "line-tables-only"

# Devices (no_std, `--no-default-features --features device-runtime`):
# no unwinding without std, so a panic aborts (src/device.rs). The opt-level
# is the speed/size choice for the firmware (verified/core/PROGRESS.md,
# "Phase 5": sizes at 3, "s" and "z"); override with
# CARGO_PROFILE_DEVICE_OPT_LEVEL.
[profile.device]
inherits = "release"
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
