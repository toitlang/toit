# The format-2 verifier as the VM runs it at untrusted launch, with its
# tools and tests. The VM links it (and through it the verified core)
# through staticlib/, the package of the one Rust static library
# (libtoit_rust.a), whose profiles the VM's library is built with. See
# README.md.

[package]
name = "toit_vmverify"
version = "0.1.0"
edition = "2021"
publish = false

# The library is an rlib only (the default crate type): Cargo ignores `lto`
# for a library that is also an rlib, so the static library is a package of
# its own (staticlib/Cargo.toml).

[[bin]]
name = "toit_vmverify_canonical"
path = "src/bin/toit_vmverify_canonical.rs"
required-features = ["std", "infer"]

[[bin]]
name = "toit_vmverify_mem"
path = "src/bin/toit_vmverify_mem.rs"
required-features = ["std", "infer"]

[[bin]]
name = "toit_vmverify_fuzz"
path = "src/bin/toit_vmverify_fuzz.rs"
required-features = ["std", "infer"]

[features]
# `std`: hosts (panics are caught and reject, phase times, counting
# allocator, test support). Without it: `no_std` + `alloc` for devices.
default = ["std", "infer", "checked-loop"]
std = ["toit_spec/std", "toit_verified_core/layout-tables"]
# Devices: the global allocator and the panic handler the VM supplies
# (src/device.rs: malloc/free, toit_vmverify_panic). Use without `std`, for
# the static library linked into device firmware (staticlib/, profile
# `device`).
device-runtime = []
# `infer`: without a shipped certificate, infer one (hosts). Without it
# (devices) a program without a certificate is rejected and the inference
# is not linked.
infer = ["toit_spec/infer"]
# `checked-loop`: the core's checked run loop (hosts: unverified trusted
# format-2 programs). Devices build without it and run format 2 only for
# programs the verifier accepted.
checked-loop = ["toit_verified_core/checked-loop"]
# `preempt-a-lot`: debug VM builds (CMake, TOIT_DEBUG).
preempt-a-lot = ["toit_verified_core/preempt-a-lot"]
# `split-loop`: the core's run loop split into a hot and a cold part
# (devices that place the hot part in IRAM; CMake TOIT_VERIFIED_CORE_SPLIT_LOOP).
split-loop = ["toit_verified_core/split-loop"]

[dependencies]
toit_spec = { path = "../spec", default-features = false }
toit_verified_core = { path = "../core", default-features = false }

# The profiles of the tools and tests (`cargo test --release`). The VM's
# library is built with those of staticlib/Cargo.toml (the same for hosts,
# plus the device profile).
# panic = "unwind" (the core alone uses "abort"): the verifier runs on
# untrusted input inside the VM, and a panic of the (untrusted) inference
# must reject the program, not abort the VM (ffi.rs, catch_unwind). The
# core's handlers do not panic; README.md has the run-loop measurement.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
debug = "line-tables-only"
