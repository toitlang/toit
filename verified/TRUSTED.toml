# Allowlist of Verus escape hatches in verified/core and verified/spec:
# every place where code is trusted instead of proven. Checked by
# verified/check.sh (verified/tools/trust_audit.toit); unlisted occurrences,
# count changes and stale entries fail the check. Regenerate the skeleton
# with `verified/check.sh --update-allowlist` (keeps justifications, new
# entries get TODO, which fails until replaced). This list must only shrink.
#
# Fields: crate, file (relative to the crate), item (qualified name),
# kind (see verified/README.md), count (occurrences of that kind in that
# item), justification (one line).

[[trusted]]
crate = "core"
file = "src/abs.rs"
item = "size_of"
kind = "global_layout"
count = 3
justification = "usize is the target's word, 8 bytes for target_pointer_width 64 and 4 for 32 (one declaration each, TRUSTED.md section 6 'Word size'), and u8 is one byte (the address arithmetic of the byte views, view::Ip): Verus fixes the width of every word proof from them; the erased build and Verus' own build for the target check each with a compile-time assertion (check.sh verifies both widths)."

[[trusted]]
crate = "core"
file = "src/alloc.rs"
item = "gc_allocate_double"
kind = "external_body"
count = 1
justification = "ASSUMED: toit_v2_allocate_double (may GC): the stack, header, globals and heap model represent a state that collections reach from the one before (toit_spec::v2::gc::gc_steps: garbage gone, live objects renumbered, weak maps processed) with exactly the spec's double (spec_common::new_double) appended (or nothing on out of memory) (alloc::gc_alloc_post); epoch unchanged implies no collection and nothing moved (the machine's fields and stack view stay); TRUSTED.md, GC and allocation, Epoch."

[[trusted]]
