name: CI EC618

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "system/**"
      - "toolchains/ec618/**"
      - "tools/ec618/**"
      - "tests/ctest/**"
      - "Makefile"
      - "actions/setup-build/**"
      - ".github/workflows/ci-ec618.yml"
      - ".github/workflows/ec618-base-release.yml"
  push:
    branches:
      - "master"
      - "floitsch/ec618"
      - "floitsch/formatter.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .
          ec618: true

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.7.2'

      - name: Install EC618 GNU toolchain - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          toolchain="$RUNNER_TEMP/gcc-arm-none-eabi-10.3-2021.10"
          archive="$RUNNER_TEMP/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          echo "97dbb4f019ad1650b732faffcc881689cedc14e2b7ee863d390e0a41ef16c9a3  $archive" |
            sha256sum --check -
          tar --extract --bzip2 --file "$archive" --directory "$RUNNER_TEMP"
          echo "EC618_GCC_PATH=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Install EC618 GNU toolchain - macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          toolchain="$RUNNER_TEMP/gcc-arm-none-eabi-10.3-2021.10"
          archive="$RUNNER_TEMP/gcc-arm-none-eabi-10.3-2021.10-mac.tar.bz2"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-mac.tar.bz2
          echo "fb613dacb25149f140f73fe9ff6c380bb43328e6bf813473986e9127e2bc283b  $archive" |
            shasum --algorithm 256 --check
          tar --extract --bzip2 --file "$archive" --directory "$RUNNER_TEMP"
          echo "EC618_GCC_PATH=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Install EC618 GNU toolchain - Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          runner_temp="$(cygpath --unix "$RUNNER_TEMP")"
          toolchain="$runner_temp/gcc-arm-none-eabi-10.3-2021.10"
          archive="$runner_temp/gcc-arm-none-eabi-10.3-2021.10-win32.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-win32.zip
          echo "d287439b3090843f3f4e29c7c41f81d958a5323aecefcf705c203bfd8ae3f2e7  $archive" |
            sha256sum --check -
          unzip -q "$archive" -d "$runner_temp"
          echo "EC618_GCC_PATH=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        shell: bash
        run: arm-none-eabi-gcc --version

      - name: Build SDK
        shell: bash
        run: make

      - name: Build EC618 base
        shell: bash
        # The Toit build consumes ap.bin and creates its own binpkg. Skip the
        # SDK's unrelated host-specific fcelf packaging step.
        env:
          BINPKG_CROSS: "true "
        run: make ec618-base

      - name: Build EC618 firmware (slot vs base + guards + envelope)
        shell: bash
        run: |
          make ec618
          test -s build/ec618/firmware.envelope
          test -s build/ec618/toit.binpkg

      - name: Record EC618 base build inputs
        shell: bash
        run: |
          {
            git rev-parse HEAD
            git submodule status third_party/luatos-soc-ec618
            arm-none-eabi-gcc --version
            xmake --version
          } > build/ec618-base/build-inputs.txt
          cp toolchains/ec618/base-api.json build/ec618-base/base-api.json

      # Preserve the exact bytes even when the following published-base gate
      # fails, so a locally qualified base can be compared with the CI build.
      - name: Preserve EC618 base candidate
        uses: actions/upload-artifact@v4
        with:
          name: ec618-base-${{ runner.os }}-${{ github.sha }}
          path: |
            build/ec618-base/base.elf
            build/ec618-base/base.bin
            build/ec618-base/base-manifest.json
            build/ec618-base/base-api.json
            build/ec618-base/build-inputs.txt
          if-no-files-found: error

      # A fresh base can hide an export missing from the deployed release.
      # Require the versioned release too; never fall back to the local build.
      - name: Download published EC618 base
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: toitlang/toit
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < toolchains/ec618/base-version)
          [[ "$version" =~ ^[0-9]+$ ]]
          tag="ec618-base-v$version"
          destination="$RUNNER_TEMP/ec618-published-base"
          mkdir -p "$destination"
          if ! gh release view "$tag" > /dev/null; then
            echo "::error::Required base release $tag is unavailable. Publish and prove this version before merging; a fresh local base is not a compatibility check."
            exit 1
          fi
          gh release download "$tag" --dir "$destination" \
            --pattern "$tag.elf" --pattern "$tag.bin" --pattern "$tag.json" \
            --pattern "$tag-api.json" --pattern "$tag-SHA256SUMS"
          (
            cd "$destination"
            sha256sum --check "$tag-SHA256SUMS"
          )
          mv "$destination/$tag.elf" "$destination/base.elf"
          mv "$destination/$tag.bin" "$destination/base.bin"
          mv "$destination/$tag.json" "$destination/base-manifest.json"
          test -s "$destination/base.elf"
          test -s "$destination/base.bin"
          test -s "$destination/base-manifest.json"

      - name: Prove firmware against published EC618 base
        if: runner.os == 'Linux'
        shell: bash
        run: make ec618 EC618_BASE_DIR="$RUNNER_TEMP/ec618-published-base"
