name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  schedule:
    - cron: '00 2 * * *' # 02:00 UTC
  push:
    branches-ignore:
      - "wip/**"
      - "wip-**"
      - "*/wip-**"
      - "*/wip/**"
  # Fork PRs run here after GitHub's configured maintainer approval. PRs from
  # this repository are covered by push and skipped by the prereqs job below.
  # Repository setting: require approval for all external contributors.
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Use 'inputs.<name>' when pasting into a bash `if`, like so:
      #    if [[ "${{ inputs.strip }}" == 'true' ]]; then ...
      #
      # When using to guard a step, use 'github.event.inputs.<name>', like so:
      #    if: ${{ github.event.inputs.<name> == 'true' }}
      # or
      #    if: ${{ github.event.inputs.<name> != 'false' }}
      # In the first case, the step will not run if there isn't any workflow dispatch.
      # In the second case, the step will run if there isn't any workflow dispatch.
      # As such, the recommendation is to use the `== true` if the default is
      # false, and the `!= false` if the default is true.
      sign:
        description: "Sign executables"
        required: false
        type: choice
        options:
          - none
          - macos
          - windows
          - macos+windows
        default: "none"
      dispatch-toitdocs:
        description: "Dispatch toitdoc rebuild"
        required: false
        type: boolean
        default: false
      tests:
        description: "Run tests"
        required: false
        type: choice
        options:
          - none
          - normal
          - more
        default: "normal"
      run-hw-tests:
        description: "Run hardware tests"
        required: false
        type: boolean
        default: false
      run-esp32-flow:
        description: "Run the ESP32 flow"
        required: false
        type: boolean
        default: true
      run-cross-flow:
        description: "Run the cross flow"
        required: false
        type: boolean
        default: true
      do-release:
        description: "Build release artifacts and upload with this version"
        required: false
        type: string
        default: ""
      ssh:
        description: "Enable ssh access to the host"
        required: false
        type: choice
        options:
          - none
          - linux
          - windows
          - macos-arm
        default: none

env:
  TOIT_VERSION: ${{ github.event.inputs.do-release || github.event.release.tag_name || '' }}
  DO_RELEASE: ${{ github.event_name == 'release' || startsWith(github.event.inputs.do-release, 'v') }}
  DO_MORE_TESTS: ${{ github.event_name == 'schedule' || github.event.inputs.tests == 'more' }}
  DO_HW_TESTS: ${{ github.event_name == 'schedule' || github.event.inputs.tests == 'more' || github.event.inputs.run-hw-tests == 'true' }}
  DO_TESTS: ${{ github.event.inputs.tests != 'none' }}
  SIGN_MACOS: ${{ github.event.inputs.sign == 'macos' || github.event.inputs.sign == 'macos+windows' }}
  SIGN_WINDOWS: ${{ github.event.inputs.sign == 'windows' || github.event.inputs.sign == 'macos+windows' }}
  DISPATCH_TOITDOCS: ${{ github.event.inputs.dispatch-toitdocs == 'true' }}
  RUN_WINDOWS_SIGN_FLOW: ${{ github.event_name == 'release' ||
                              startsWith(github.event.inputs.do-release, 'v') ||
                              github.event.inputs.sign == 'windows' ||
                              github.event.inputs.sign == 'macos+windows' }}
  RUN_MACOS_SIGN_FLOW: ${{ github.event_name == 'release' ||
                            startsWith(github.event.inputs.do-release, 'v') ||
                            github.event.inputs.sign == 'macos' ||
                            github.event.inputs.sign == 'macos+windows' }}
  RUN_ESP32_FLOW: ${{ github.event.inputs.run-esp32-flow != 'false' }}
  RUN_CROSS_FLOW: ${{ github.event.inputs.run-cross-flow != 'false' }}
  RUN_AUR_FLOW: ${{ github.event_name == 'release' || startsWith(github.event.inputs.do-release, 'v') }}
  ENABLE_SSH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ssh != 'none' }}
  ESPTOOL_VERSION: "v5.1.0%2Btoitlang.universal"

jobs:
  prereqs:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        if: github.event_name == 'workflow_dispatch'
        run: echo "${{ toJSON(github.event.inputs) }}"

      - name: Set strategy variables
        id: vars
        run: |
          # The cross-flow must be enabled when signing.
          if [[ "${{ env.RUN_WINDOWS_SIGN_FLOW }}" == "true" || \
                "${{ env.RUN_MACOS_SIGN_FLOW }}" == "true" ]]; then
            echo 'RUN_CROSS_FLOW=true' >> $GITHUB_ENV
          fi

          # The ESP32 flow must be enabled when running hardware tests.
          if [[ "${{ env.DO_HW_TESTS }}" == "true" ]]; then
            echo 'RUN_ESP32_FLOW=true' >> $GITHUB_ENV
          fi

          # When running ssh, only run a single shard of the corresponding platform.
          if [[ ${{ env.ENABLE_SSH }} == "true" ]]; then
            echo 'SHARDS=[1]' >> $GITHUB_OUTPUT
            echo 'SHARDS_LINUX=[1]' >> $GITHUB_OUTPUT
            platform=${{ github.event.inputs.ssh }}
            # Switch to the corresponding container.
            if [[ "$platform" == "linux" ]]; then
              echo 'CONTAINERS=[ "ubuntu-22.04" ]' >> $GITHUB_OUTPUT
            elif [[ "$platform" == "windows" ]]; then
              echo 'CONTAINERS=[ "windows-latest" ]' >> $GITHUB_OUTPUT
            elif [[ "$platform" == "macos-arm" ]]; then
              echo 'CONTAINERS=[ "macos-latest" ]' >> $GITHUB_OUTPUT
            else
              echo "Unknown platform: $platform"
              exit 1
            fi
            exit 0
          fi

          # ubuntu-22.04 so that we don't depend on a recent glibc.
          echo 'CONTAINERS=[ "ubuntu-22.04", "macos-latest", "windows-latest" ]' >> $GITHUB_OUTPUT
          if [[ "${{ env.DO_TESTS }}" == "true" ]]; then
            echo 'SHARDS=[1, 2, 3, 4, 5]' >> $GITHUB_OUTPUT
            echo 'SHARDS_LINUX=[1, 2, 3, 4, 5, 6, 7]' >> $GITHUB_OUTPUT
          else
            echo 'SHARDS=[1]' >> $GITHUB_OUTPUT
            echo 'SHARDS_LINUX=[1]' >> $GITHUB_OUTPUT
          fi

    outputs:
      CONTAINERS: ${{ steps.vars.outputs.CONTAINERS }}
      SHARDS: ${{ steps.vars.outputs.SHARDS }}
      SHARDS_LINUX: ${{ steps.vars.outputs.SHARDS_LINUX }}
      DO_HW_TESTS: ${{ env.DO_HW_TESTS }}
      RUN_ESP32_FLOW: ${{ env.RUN_ESP32_FLOW }}
      RUN_CROSS_FLOW: ${{ env.RUN_CROSS_FLOW }}
      RUN_WINDOWS_SIGN_FLOW: ${{ env.RUN_WINDOWS_SIGN_FLOW }}
      RUN_MACOS_SIGN_FLOW: ${{ env.RUN_MACOS_SIGN_FLOW }}
      RUN_AUR_FLOW: ${{ env.RUN_AUR_FLOW }}

  # Keep the test jobs at the top level: branch protection requires their
  # existing "build (runner, shard)" check names. Share their steps through a
  # composite action, and let each platform depend on only its own build.
  compile_linux:
    needs: prereqs
    if: contains(needs.prereqs.outputs.CONTAINERS, 'ubuntu-22.04')
    uses: ./.github/workflows/ci-host-build.yml
    with:
      container: ubuntu-22.04

  build_linux:
    name: "build (ubuntu-22.04, ${{ matrix.shard }})"
    needs: [prereqs, compile_linux]
    if: contains(needs.prereqs.outputs.CONTAINERS, 'ubuntu-22.04')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prereqs.outputs.SHARDS_LINUX) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./actions/test-host
        with:
          container: ubuntu-22.04
          shard: ${{ matrix.shard }}
          shard-count: ${{ strategy.job-total }}
          toit-version: ${{ needs.compile_linux.outputs.toit-version }}
          ngrok-auth-token: ${{ secrets.NGROK_FLORIAN }}
          repository-dispatch-token: ${{ secrets.LEON_REPOSITORY_DISPATCH }}

  compile_macos:
    needs: prereqs
    if: contains(needs.prereqs.outputs.CONTAINERS, 'macos-latest')
    uses: ./.github/workflows/ci-host-build.yml
    with:
      container: macos-latest

  build_macos:
    name: "build (macos-latest, ${{ matrix.shard }})"
    needs: [prereqs, compile_macos]
    if: contains(needs.prereqs.outputs.CONTAINERS, 'macos-latest')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prereqs.outputs.SHARDS) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./actions/test-host
        with:
          container: macos-latest
          shard: ${{ matrix.shard }}
          shard-count: ${{ strategy.job-total }}
          toit-version: ${{ needs.compile_macos.outputs.toit-version }}
          ngrok-auth-token: ${{ secrets.NGROK_FLORIAN }}
          repository-dispatch-token: ${{ secrets.LEON_REPOSITORY_DISPATCH }}

  compile_windows:
    needs: prereqs
    if: contains(needs.prereqs.outputs.CONTAINERS, 'windows-latest')
    uses: ./.github/workflows/ci-host-build.yml
    with:
      container: windows-latest

  build_windows:
    name: "build (windows-latest, ${{ matrix.shard }})"
    needs: [prereqs, compile_windows]
    if: contains(needs.prereqs.outputs.CONTAINERS, 'windows-latest')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prereqs.outputs.SHARDS) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./actions/test-host
        with:
          container: windows-latest
          shard: ${{ matrix.shard }}
          shard-count: ${{ strategy.job-total }}
          toit-version: ${{ needs.compile_windows.outputs.toit-version }}
          ngrok-auth-token: ${{ secrets.NGROK_FLORIAN }}
          repository-dispatch-token: ${{ secrets.LEON_REPOSITORY_DISPATCH }}

  # Preserve the aggregate dependency used by packaging and external-test
  # reporting. Include the compile jobs so an unsuccessful build cannot be
  # hidden by a skipped test job.
  build:
    needs: [prereqs, compile_linux, compile_macos, compile_windows, build_linux, build_macos, build_windows]
    if: ${{ !cancelled() && needs.prereqs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check host builds and tests
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == 'true' ]]; then
            echo 'A host build or test shard failed.'
            exit 1
          fi

  esp32:
    needs: [prereqs]
    if: needs.prereqs.outputs.RUN_ESP32_FLOW == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .
          esp32: true
          cache-key-prefix: esp32

      # Verify that the firmware tool's flash-size assumption still holds: the
      # flash size must not be read from CONFIG_ESPTOOLPY_FLASHSIZE at runtime.
      - name: Check esp-idf assumptions
        run: make check-esp-idf-assumption

      # Build using make.
      - name: make
        run: |
          ccache -s
          source third_party/esp-idf/export.sh
          # Install the Python packages necessary for MbedTLS after
          # setting up the virtual Python environment.
          pip install jsonschema jinja2
          make esp32
          make ESP32_CHIP=esp32c3 esp32
          make ESP32_CHIP=esp32c6 esp32
          make ESP32_CHIP=esp32p4 esp32
          make ESP32_CHIP=esp32s2 esp32
          make ESP32_CHIP=esp32s3 esp32
          ccache -s

      - name: Build ESP32-S3 USB Serial/JTAG console firmware
        run: tests/qemu/build-s3-usb-envelope.sh

      - name: Install bundled esptool
        run: make install-esptool

      - name: Install latest Toit QEMU release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QEMU_VERSION="$(gh release view --repo toitlang/qemu --json tagName --jq .tagName)"
          QEMU_ARCHIVE="qemu-toit-${QEMU_VERSION}-linux-x86_64.tar.gz"
          QEMU_DIR="${RUNNER_TEMP}/toit-qemu"
          mkdir -p "${QEMU_DIR}"
          gh release download "${QEMU_VERSION}" --repo toitlang/qemu \
            --pattern "${QEMU_ARCHIVE}" --pattern SHA256SUMS --dir "${QEMU_DIR}"
          cd "${QEMU_DIR}"
          grep " ${QEMU_ARCHIVE}$" SHA256SUMS | sha256sum --check
          tar -xf "${QEMU_ARCHIVE}"
          echo "QEMU_SYSTEM_XTENSA=${QEMU_DIR}/qemu-toit-${QEMU_VERSION}-linux-x86_64/bin/qemu-system-xtensa" >> "${GITHUB_ENV}"

      - name: Test ESP32 flashing and standard streams in QEMU
        run: tests/qemu/run-tests.sh

      - name: Pack firmware artifacts
        shell: bash
        run: |
          gzip --to-stdout build/esp32/firmware.envelope > build/firmware-esp32.gz
          gzip --to-stdout build/esp32c3/firmware.envelope > build/firmware-esp32c3.gz
          gzip --to-stdout build/esp32s2/firmware.envelope > build/firmware-esp32s2.gz
          gzip --to-stdout build/esp32s3/firmware.envelope > build/firmware-esp32s3.gz

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmwares
          path: |
            build/firmware-esp32.gz
            build/firmware-esp32c3.gz
            build/firmware-esp32s2.gz
            build/firmware-esp32s3.gz

  # Build every envelope variant nightly. Keep this independent of the regular
  # ESP32 job so its failures do not prevent checking the remaining variants.
  esp32-envelope-sizes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: toitlang/envelopes
          ref: main
          path: build/partition-size-envelopes
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: toitlang/jaguar
          # Follow Jaguar's default branch (currently main).
          path: build/partition-size-jaguar
          persist-credentials: false

      - name: Set up build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .
          esp32: true
          cache-key-prefix: esp32-envelope-sizes

      - name: Build SDK and size-check tools
        run: |
          make sdk
          build/host/sdk/bin/toit pkg install --project-root=build/partition-size-jaguar
          build/host/sdk/bin/toit compile -O2 --snapshot \
            -o build/partition-size-jaguar.snapshot \
            build/partition-size-jaguar/src/jaguar.toit
          build/host/sdk/bin/toit pkg install --project-root=build/partition-size-envelopes/tools
          build/host/sdk/bin/toit compile -o build/partition-size-envelope-tool \
            build/partition-size-envelopes/tools/main.toit

      - name: Build and check all ESP32 envelope variants
        env:
          CCACHE_MAXSIZE: 600M
        run: |
          source third_party/esp-idf/export.sh
          bash tests/esp32/check-envelope-variants.sh \
            build/partition-size-envelopes \
            build/partition-size-envelope-tool \
            build/partition-size-jaguar.snapshot

  # The raspbian executable is also built on the 'cross' job, but we want to
  # run the serial test as fast as possible and don't want to wait for the
  # 'cross' job to finish.
  rpi:
    runs-on: ubuntu-latest
    needs: prereqs
    if: needs.prereqs.outputs.DO_HW_TESTS == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          if [ -z "$TOIT_VERSION" ]; then
            TOIT_VERSION=$(cmake -DPRINT_VERSION=1 -P tools/gitversion.cmake)
          fi
          echo "TOIT_GIT_VERSION=$TOIT_VERSION" >> $GITHUB_ENV

      - name: Set up build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .
          cache-key-prefix: cross-pi

      - name: Make
        # Note that the TOIT_GIT_VERSION is set. The make step will thus not
        # compute the version from git.
        run: |
          make raspbian

      - name: Pack artifacts
        shell: bash
        run: |
          make TARGET=raspbian prefix=./build/raspbian/toit install
          tar -czf build/rpi.tar.gz -C ./build/raspbian toit

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpi-build
          path: |
            build/rpi.tar.gz

  cross:
    needs: [prereqs]
    if: needs.prereqs.outputs.RUN_CROSS_FLOW == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Set up constants
        id: constants
        shell: bash
        run: |
          echo raspberry_pi_artifact=toit-rpi.tar.gz >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set version
        run: |
          if [ -z "$TOIT_VERSION" ]; then
            TOIT_VERSION=$(cmake -DPRINT_VERSION=1 -P tools/gitversion.cmake)
          fi
          echo "TOIT_GIT_VERSION=$TOIT_VERSION" >> $GITHUB_ENV

      - name: Set up build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .
          cache-key-prefix: cross

      - name: Install mingw
        run: |
          sudo apt-get install mingw-w64

      - name: Make envelopes
        run: |
          make TARGET=win64 build-envelope
          make TARGET=raspbian build-envelope
          make TARGET=aarch64 build-envelope
          make TARGET=arm-linux-gnueabi build-envelope

      - name: Check envelopes exist
        run: |
          ls build/win64/firmware.envelope
          ls build/raspbian/firmware.envelope
          ls build/aarch64/firmware.envelope
          ls build/arm-linux-gnueabi/firmware.envelope

      - name: Make
        # Note that the TOIT_GIT_VERSION is set. The make step will thus not
        # compute the version from git.
        run: |
          make sdk
          make TARGET=win64 sdk
          make raspbian
          make aarch64
          make arm-linux-gnueabi
          make riscv64

      - name: Build test snapshot
        run: |
          echo '
          import .system.extensions.host.run-image-exit-codes
          main:
            print "hello world"
            exit EXIT-CODE-STOP
          ' > hello.toit

          build/host/sdk/bin/toit compile --snapshot -o hello.snapshot hello.toit

      - name: Customize and extract envelopes
        run: |
          for arch in raspbian aarch64 riscv64; do
            cp build/$arch/firmware.envelope $arch.envelope

            build/host/sdk/bin/toit tool firmware container install \
              hello hello.snapshot \
              -e $arch.envelope

            build/host/sdk/bin/toit tool firmware extract \
              -e $arch.envelope \
              --format "tar" \
              -o build/$arch/extracted.tar

            mkdir build/$arch/extracted
            tar -xf build/$arch/extracted.tar -C build/$arch/extracted
          done

      - name: Test 32-bit executables
        if: env.DO_MORE_TESTS == 'true' || env.DO_HW_TESTS != 'true'
        uses: pguyot/arm-runner-action@v2
        with:
          cpu: cortex-a7
          base_image: "raspios_lite:2022-01-28"
          bind_mount_repository: true
          commands: |
              uname -m > pi_uname
              build/raspbian/sdk/bin/toit version
              build/raspbian/sdk/lib/toit/bin/toit.run --version
              build/raspbian/extracted/boot.sh > raspbian_output

      - name: Check that the 32-bit run-script worked
        if: env.DO_MORE_TESTS == 'true' || env.DO_HW_TESTS != 'true'
        run: |
          cat raspbian_output
          grep "hello world" raspbian_output

      - name: Test executables 64-bit
        uses: pguyot/arm-runner-action@v2
        with:
          cpu: cortex-a7
          base_image: "raspios_lite_arm64:2022-01-28"
          bind_mount_repository: true
          commands: |
              uname -m > pi_uname
              build/aarch64/sdk/bin/toit version
              build/aarch64/sdk/lib/toit/bin/toit.run --version
              build/aarch64/extracted/boot.sh > aarch64_output

      - name: Check that the 64-bit run-script worked
        run: |
          cat aarch64_output
          grep "hello world" aarch64_output

      - name: Pack artifacts
        shell: bash
        run: |
          make TARGET=raspbian prefix=build/raspbian/toit install
          tar -czf build/${{ steps.constants.outputs.raspberry_pi_artifact }} -C ./build/raspbian toit
          make TARGET=aarch64 prefix=build/aarch64/toit install
          tar -czf build/toit-aarch64.tar.gz -C ./build/aarch64 --dereference toit
          make TARGET=riscv64 prefix=build/riscv64/toit install
          tar -czf build/toit-riscv64.tar.gz -C ./build/riscv64 --dereference toit

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-build-cross
          path: |
            build/${{ steps.constants.outputs.raspberry_pi_artifact }}
            build/toit-aarch64.tar.gz
            build/toit-riscv64.tar.gz

  combine:
    needs: [build, cross]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Windows-build-unsigned

      - uses: actions/download-artifact@v8
        with:
          pattern: Linux-build*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: macOS-build-unsigned*
          merge-multiple: true

      - name: Unpack SDKs
        run: |
          for os in windows linux macos rpi aarch64 riscv64; do
            mkdir -p $os
            tar x -zf toit-$os.tar.gz -C $os
          done

      - name: Copy vessels
        run: |
          mkdir -p vessels

          for source in windows linux macos rpi aarch64 riscv64; do
            # Use same values as Go.
            if [[ "$source" == "windows" ]]; then
              CROSS_OS=windows
              CROSS_ARCH=amd64
            elif [[ "$source" == "linux" ]]; then
              CROSS_OS=linux
              CROSS_ARCH=amd64
            elif [[ "$source" == "macos" ]]; then
              CROSS_OS=darwin
              CROSS_ARCH=aarch64
            elif [[ "$source" == "rpi" ]]; then
              CROSS_OS=linux
              CROSS_ARCH=arm
            elif [[ "$source" == "aarch64" ]]; then
              CROSS_OS=linux
              CROSS_ARCH=arm64
            elif [[ "$source" == "riscv64" ]]; then
              CROSS_OS=linux
              CROSS_ARCH=riscv64
            else
              echo "Unknown source: $source"
              exit 1
            fi

            mkdir -p vessels/$CROSS_OS/$CROSS_ARCH
            cp $source/toit/lib/toit/vessels/vessel* vessels/$CROSS_OS/$CROSS_ARCH

            for target in windows linux macos rpi aarch64 riscv64; do
              if [[ "$source" == "$target" ]]; then
                continue
              fi
              mkdir -p $target/toit/lib/toit/vessels/$CROSS_OS/$CROSS_ARCH
              cp $source/toit/lib/toit/vessels/vessel* $target/toit/lib/toit/vessels/$CROSS_OS/$CROSS_ARCH
            done
          done

      - name: Create vessels artifact
        run: |
          tar c -zf vessels.tar.gz vessels

      - name: Download esptools
        run: |
          for os in windows linux macos rpi aarch64 riscv64; do
            EXTENSION=""
            ARCH_EXTENSION=.tar.gz
            if [[ "$os" == "windows" ]]; then
              EXTENSION=.exe
              ESPTOOL_ARCH=windows-amd64
              ARCH_EXTENSION=.zip
            elif [[ "$os" == "linux" ]]; then
              ESPTOOL_ARCH=linux-amd64
            elif [[ "$os" == "rpi" ]]; then
              ESPTOOL_ARCH=linux-armv7
            elif [[ "$os" == "aarch64" ]]; then
              ESPTOOL_ARCH=linux-aarch64
            elif [[ "$os" == "riscv64" ]]; then
              ESPTOOL_ARCH=linux-riscv64
            elif [[ "$os" == "macos" ]]; then
              ESPTOOL_ARCH=macos-aarch64
            else
              echo "Unknown os: $os"
              exit 1
            fi

            echo "Downloading esptool for $os ($ESPTOOL_ARCH)..."
            echo https://github.com/toitlang/esptool/releases/download/$ESPTOOL_VERSION/esptool-$ESPTOOL_ARCH$ARCH_EXTENSION
            curl -O -L https://github.com/toitlang/esptool/releases/download/$ESPTOOL_VERSION/esptool-$ESPTOOL_ARCH$ARCH_EXTENSION
            if [[ "$ARCH_EXTENSION" == ".zip" ]]; then
              unzip esptool-$ESPTOOL_ARCH$ARCH_EXTENSION
            else
              tar x -zvf esptool-$ESPTOOL_ARCH$ARCH_EXTENSION
            fi
            mkdir -p $os/toit/lib/toit/bin
            cp esptool-$ESPTOOL_ARCH/esptool$EXTENSION $os/toit/lib/toit/bin/esptool$EXTENSION
            chmod +x $os/toit/lib/toit/bin/esptool$EXTENSION
          done

      - name: Compress SDKs
        run: |
          for os in windows linux macos rpi aarch64 riscv64; do
            tar c -zf toit-$os.tar.gz -C $os toit
          done

      - name: Add/rename tar-balls with/to improved naming
        run: |
          cp toit-linux.tar.gz toit-linux-x64.tar.gz
          cp toit-rpi.tar.gz toit-linux-armv7.tar.gz
          cp toit-aarch64.tar.gz toit-linux-aarch64.tar.gz
          mv toit-riscv64.tar.gz toit-linux-riscv64.tar.gz

      - name: Upload vessels
        uses: actions/upload-artifact@v7
        with:
          name: vessels
          path: vessels.tar.gz

      - name: Upload Windows unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Windows-build-unsigned-combined
          path: toit-windows.tar.gz

      - name: Upload macOS unsigned
        uses: actions/upload-artifact@v7
        with:
          name: macOS-build-unsigned-combined
          path: toit-macos.tar.gz

      - name: Upload Linux
        uses: actions/upload-artifact@v7
        with:
          name: Linux-build-combined
          path: |
            toit-linux-x64.tar.gz
            toit-linux-armv7.tar.gz
            toit-linux-aarch64.tar.gz
            toit-linux-riscv64.tar.gz

      - name: Upload release vessels
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: vessels.tar.gz
          tag: ${{ env.TOIT_VERSION }}
          overwrite: true

      - name: Prepare for Linux release upload
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        run: |
          mkdir -p linux-upload
          cp toit-linux.tar.gz linux-upload
          cp toit-rpi.tar.gz linux-upload
          cp toit-aarch64.tar.gz linux-upload
          cp toit-linux-x64.tar.gz linux-upload
          cp toit-linux-armv7.tar.gz linux-upload
          cp toit-linux-aarch64.tar.gz linux-upload
          cp toit-linux-riscv64.tar.gz linux-upload

      - name: Upload Linux release
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: linux-upload/*
          tag: ${{ env.TOIT_VERSION }}
          overwrite: true

  test_cross:
    runs-on: ${{ matrix.os }}
    needs: [prereqs, combine]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Set up constants
        id: constants
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "artifact=toit-linux-x64.tar.gz" >> $GITHUB_OUTPUT
            echo "artifact_name=Linux-build-combined" >> $GITHUB_OUTPUT
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "artifact=toit-macos.tar.gz" >> $GITHUB_OUTPUT
            echo "artifact_name=macOS-build-unsigned-combined" >> $GITHUB_OUTPUT
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "artifact=toit-windows.tar.gz" >> $GITHUB_OUTPUT
            echo "artifact_name=Windows-build-unsigned-combined" >> $GITHUB_OUTPUT
          else
            echo "UNSUPPORTED RUNNER: $RUNNER_OS"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.constants.outputs.artifact_name }}

      - name: Unpack SDK
        shell: bash
        run: |
          tar x -zf ${{ steps.constants.outputs.artifact }}

      - name: Test cross compilation
        shell: bash
        run: |
          echo 'main: print "hello world"' > hello.toit
          for out_os in linux darwin windows; do
            for out_arch in amd64 aarch64 arm arm64 riscv64; do
              # The windows build of the compiler needs .exe
              COMPILER="toit/bin/toit"
              if [[ "$RUNNER_OS" == "Windows" ]]; then COMPILER="toit/bin/toit.exe"; fi

              VESSEL_ARCH=$out_arch
              if [[ "$out_os" == "darwin" && "$out_arch" == "amd64" ]]; then
                # The compiler automatically uses the fat binary in aarch64 for amd64 darwin.
                VESSEL_ARCH="aarch64"
              fi

              if [ -d "toit/lib/toit/vessels/$out_os/$VESSEL_ARCH" ]; then
                echo "Cross-compiling for $out_os/$out_arch"
                ./$COMPILER compile --os=$out_os --arch=$out_arch -o hello_out hello.toit
              fi
            done
          done

  sign_windows:
    runs-on: windows-latest
    needs: [prereqs, combine]
    if: needs.prereqs.outputs.RUN_WINDOWS_SIGN_FLOW == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        shell: powershell
        run: |
          choco install -y innosetup

      - uses: actions/download-artifact@v8
        with:
          name: Windows-build-unsigned-combined

      - name: Decompress
        run: |
          & "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail -c "tar -xzf toit-windows.tar.gz"

      - name: Sign Windows binary
        uses: toitlang/action-sign-server@26db6e4021bfbd79af777d15964f1ab70bcfd3a4  # v1.0.7
        with:
          uri: ${{ vars.CERTUM_URI }}
          password: ${{ secrets.CERTUM_PWD }}
          path: toit/bin

      - name: Sign Windows tools
        uses: toitlang/action-sign-server@26db6e4021bfbd79af777d15964f1ab70bcfd3a4  # v1.0.7
        with:
          uri: ${{ vars.CERTUM_URI }}
          password: ${{ secrets.CERTUM_PWD }}
          path: toit/lib/toit/bin

      - name: Compress
        run: |
          & "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail -c "tar -czf toit-windows.tar.gz toit"

      - name: Version number
        id: version
        shell: powershell
        run: |
          # If the version is empty, use 'v0.0.0' instead.
          if ([string]::IsNullOrEmpty($env:TOIT_VERSION)) {
            $env:TOIT_VERSION = 'v0.0.0'
            echo "TOIT_VERSION=$($env:TOIT_VERSION)" >> $env:GITHUB_ENV
          }
          $versionV = $env:TOIT_VERSION
          $version = $versionV.Substring(1)
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: |
          & tools\windows_installer\build.bat ${{ steps.version.outputs.version }} $PWD\toit $PWD\toit-windows-x64-installer.exe

      - name: Sign Windows installer
        uses: toitlang/action-sign-server@26db6e4021bfbd79af777d15964f1ab70bcfd3a4  # v1.0.7
        with:
          uri: ${{ vars.CERTUM_URI }}
          password: ${{ secrets.CERTUM_PWD }}
          path: toit-windows-x64-installer.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-build-signed
          path: |
            toit-windows-x64.tar.gz
            toit-windows-x64-installer.exe

      - name: Prepare upload
        run: |
          mkdir -p windows-upload
          cp toit-windows.tar.gz windows-upload/toit-windows.tar.gz
          cp toit-windows.tar.gz windows-upload/toit-windows-x64.tar.gz
          cp toit-windows-x64-installer.exe windows-upload/toit-windows-x64-installer.exe

      - name: Upload release artifacts
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: windows-upload/*
          tag: ${{ env.TOIT_VERSION }}
          overwrite: true

      - name: Download winget binary
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Update manifest
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        run: |
          .\wingetcreate.exe update Toit.Toit -s -v ${{ steps.version.outputs.version }} -u https://github.com/toitlang/toit/releases/download/${{ env.TOIT_VERSION }}/toit-windows-x64-installer.exe -t ${{ secrets.WINGET_PAT }}

  sign_macos:
    runs-on: macos-latest  # An arm64 runner.
    needs: [prereqs, combine]
    if: needs.prereqs.outputs.RUN_MACOS_SIGN_FLOW == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          set -e
          brew install create-dmg
          brew install zip

      - uses: actions/download-artifact@v8
        with:
          name: macOS-build-unsigned-combined

      - name: Create out folder
        run: |
          mkdir out

      - name: Decompress
        run: |
          tar x -zf toit-macos.tar.gz
          mv toit toit-macos

      - name: List executables
        id: list-executables
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "result<<$EOF" >> $GITHUB_OUTPUT
          # Also sign the vessels, as all binaries inside a DMG must be signed.
          find toit-macos/bin toit-macos/lib/toit/bin \
               toit-macos/lib/toit/vessels/vessel* \
               -type f \
               ! -regex '.*/esptool' \
               >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Sign macOS executables
        uses: toitlang/action-macos-sign-notarize@385e50b59cf23df408e3361c28d3d665f4730dd1 # v1.3.0
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          username: ${{ secrets.AC_USERNAME }}
          password: ${{ secrets.AC_PASSWORD }}
          apple-team-id: ${{ vars.MACOS_TEAM_ID }}
          app-path: ${{ steps.list-executables.outputs.result }}

      - name: Compress
        run: |
          mv toit-macos toit
          tar c -zf out/toit-macos.tar.gz toit
          mv toit toit-macos

      - name: Create DMGs
        run: |
          set -e
          ln -s sdk/bin/toit toit-symlink
          # Use an empty directory as source so we don't accidentally add other files than SDK.
          mkdir empty-arm
          create-dmg \
              --volname "jag" \
              --add-file toit toit-symlink 0 0 \
              --add-file sdk toit-macos 200 0 \
              out/toit-macos.dmg \
              empty-arm

      - name: Sign DMGs
        uses: toitlang/action-macos-sign-notarize@385e50b59cf23df408e3361c28d3d665f4730dd1 # v1.3.0
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          username: ${{ secrets.AC_USERNAME }}
          password: ${{ secrets.AC_PASSWORD }}
          apple-team-id: ${{ vars.MACOS_TEAM_ID }}
          app-path: |
            out/toit-macos.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macOS-build-signed
          path: |
            out/toit-macos.tar.gz
            out/toit-macos.dmg

      - name: Prepare upload
        run: |
          mkdir -p macos-upload
          cp out/toit-macos.tar.gz macos-upload/toit-macos.tar.gz
          cp out/toit-macos.dmg macos-upload/toit-macos.dmg

      - name: Upload release artifacts x64
        if: (env.DO_RELEASE == 'true' && github.repository_owner == 'toitlang')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: macos-upload/*
          tag: ${{ env.TOIT_VERSION }}
          overwrite: true

  external-and-flaky:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Set up constants
        id: constants
        shell: bash
        run: |
          echo flaky_result_dir=flaky-result >> $GITHUB_OUTPUT
          echo flaky_result_name=flaky-result-${{ github.run_id }}-${{ github.run_attempt }} >> $GITHUB_OUTPUT
          echo external_result_dir=external-result >> $GITHUB_OUTPUT
          echo external_result_name=external-result-${{ github.run_id }}-${{ github.run_attempt }} >> $GITHUB_OUTPUT

      - name: Retrieve
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.constants.outputs.flaky_result_name }}*
          path: flaky-result
          merge-multiple: true

      - name: Retrieve
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.constants.outputs.external_result_name }}*
          path: external-result
          merge-multiple: true

      - name: List downloaded files
        # This is mostly for debugging purposes.
        shell: bash
        run: |
          find .

      - name: Check external
        shell: bash
        id: external
        run: |
          for f in external-result/*; do
            echo "$f: $(cat $f)";
          done
          if grep "fail" external-result/*; then
            echo "result=fail" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Check flaky
        shell: bash
        id: flaky
        run: |
          for f in flaky-result/*; do
            echo "$f: $(cat $f)";
          done
          if grep "fail" flaky-result/*; then
            echo "result=fail" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Check for failures
        # We don't want to fail the action if it's a scheduled run.
        if: github.event_name != 'schedule'
        run: |
          if [[ "${{ steps.external.outputs.result }}" == "fail" || \
                "${{ steps.flaky.outputs.result }}" == "fail" ]]; then
            echo "Found failures in external or flaky tests."
            echo "external: ${{ steps.external.outputs.result }}"
            echo "flaky: ${{ steps.flaky.outputs.result }}"
            exit 1
          fi

  AUR:
    name: Update AUR package
    runs-on: ubuntu-latest
    needs: [prereqs, combine]
    if: needs.prereqs.outputs.RUN_AUR_FLOW == 'true'

    steps:
      # This shouldn't be necessary, but the archlinux-package-action
      # doesn't work without it.
      - uses: actions/checkout@v7

      - name: Ssh
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          echo "$AUR_SSH_KEY" > ${{ github.workspace }}/aur_ssh_key
          chmod 600 ${{ github.workspace }}/aur_ssh_key

          mkdir -p $HOME/.ssh
          echo "Host aur.archlinux.org" >> $HOME/.ssh/config
          echo "  IdentityFile ${{ github.workspace }}/aur_ssh_key" >> $HOME/.ssh/config
          echo "  User aur" >> $HOME/.ssh/config

          ssh-keyscan -H aur.archlinux.org > $HOME/.ssh/known_hosts

      - name: Fetch AUR package
        run: |
          git clone ssh://aur@aur.archlinux.org/toit-vessels-bin.git

      - name: Configure git
        run: |
          cd toit-vessels-bin
          git config user.email "leon@toit.io"
          git config user.name "Leon Gungadin Mogensen"

      - name: Update AUR package
        shell: bash
        run: |
          cd toit-vessels-bin
          sed -i "s/_pkgver=.*/_pkgver=\"${{ env.TOIT_VERSION }}\"/g" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/g" PKGBUILD

      - name: Update pkgsums and .SRCINFO for toit-vessels-bin
        uses: toitlang/archlinux-package-action@main
        with:
          path: toit-vessels-bin
          flags: ''
          namcap: false
          updpkgsums: true
          srcinfo: true

      - name: Upload toit-vessels-bin
        run: |
          cd toit-vessels-bin
          cat PKGBUILD
          cat .SRCINFO
          git commit -am "Update to version ${{ env.TOIT_VERSION }}"
          git push origin master

  serial:
    needs: [prereqs, rpi, esp32]
    if: needs.prereqs.outputs.DO_HW_TESTS == 'true'

    runs-on: serial

    steps:
      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/*

      - uses: actions/checkout@v7

      # We need a more recent version of cmake than is installed globally.
      - name: Add local bin to PATH
        run: |
          echo "$HOME/local/bin" >> $GITHUB_PATH

      # Download the Pi artifact.
      - name: Download the SDK
        uses: actions/download-artifact@v8
        with:
          name: rpi-build

      - name: Unpack the Toit SDK
        run: |
          mkdir -p rpi
          tar x -zf rpi.tar.gz -C rpi

      - name: Test Raspberry Pi
        env:
          TOIT_EXE_HW: ${{ github.workspace }}/rpi/toit/bin/toit
        run: |
          source $HOME/pi-test.env
          make test-hw-pi

      - name: Download esptool
        # The Toit SDK we got is not yet combined and thus missing the esptool.
        run: |
          export ESPTOOL_ARCH=linux-armv7
          curl -O -L https://github.com/toitlang/esptool/releases/download/$ESPTOOL_VERSION/esptool-$ESPTOOL_ARCH.tar.gz
          tar x -zvf esptool-$ESPTOOL_ARCH.tar.gz
          cp esptool-$ESPTOOL_ARCH/esptool$EXTENSION rpi/toit/lib/toit/bin/esptool$EXTENSION
          chmod +x rpi/toit/lib/toit/bin/esptool$EXTENSION

      - name: Download ESP32 envelopes
        uses: actions/download-artifact@v8
        with:
          name: firmwares

      - name: Unpack the ESP32 firmware
        run: |
          gunzip firmware-esp32.gz
          gunzip firmware-esp32s3.gz

      - name: Test ESP32 rig
        env:
          TOIT_EXE_HW: ${{ github.workspace }}/rpi/toit/bin/toit
          ESP32_ENVELOPE: ${{ github.workspace }}/firmware-esp32
          ESP32S3_ENVELOPE: ${{ github.workspace }}/firmware-esp32s3
        run: |
          # Get the esp32 port and wifi configuration from the file in the runner's home.
          source $HOME/esp32-test.env

          make test-hw-esp32
