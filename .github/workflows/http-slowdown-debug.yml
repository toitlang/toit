name: HTTP slowdown debug

on:
  push:
    branches:
      - "floitsch/http-slowdown-debug"
  workflow_dispatch:
    inputs:
      attempts:
        description: "Maximum number of focused Artemis test attempts"
        required: false
        type: number
        default: 100
      raw_attempts:
        description: "Maximum number of minimal raw TCP attempts"
        required: false
        type: number
        default: 200
      timeout:
        description: "Timeout in seconds for each attempt"
        required: false
        type: number
        default: 180
      artemis-ref:
        description: "Artemis branch containing the reproducer"
        required: false
        type: string
        default: "floitsch/build-artemis-service.s-new.190"

concurrency:
  group: http-slowdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out instrumented SDK
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up SDK build
        uses: ./actions/setup-build
        with:
          toit-dir: .

      - name: Build instrumented SDK
        run: make sdk

      - name: Exercise minimal raw TCP reproducer
        id: raw-reproduce
        shell: bash
        env:
          TOIT_DEBUG_TCP_READ: "1"
          RAW_ATTEMPTS: ${{ inputs.raw_attempts || 200 }}
        run: |
          mkdir -p http-debug
          if [[ -z "$RAW_ATTEMPTS" || "$RAW_ATTEMPTS" -lt 1 ]]; then
            RAW_ATTEMPTS=200
          fi
          server_log=$(mktemp)
          client_log=$(mktemp)
          result=0
          set +e
          for attempt in $(seq 1 "$RAW_ATTEMPTS"); do
            echo "Raw TCP attempt $attempt/$RAW_ATTEMPTS" \
                | tee -a http-debug/raw-reproducer.log
            port=$((30000 + attempt))
            : > "$server_log"
            : > "$client_log"
            TOIT_DEBUG_TCP_READ=1 timeout 10s build/host/sdk/bin/toit run \
                --project-root=/tmp -- \
                tests/tcp-receive-buffer-clamp-repro.toit server "$port" \
                > "$server_log" 2>&1 &
            server_pid=$!

            ready=0
            for _ in $(seq 1 100); do
              if grep -q 'TCP_CLAMP_REPRO ready' "$server_log"; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 0.01
            done

            client_result=1
            if [[ "$ready" -eq 1 ]]; then
              TOIT_DEBUG_TCP_READ=1 timeout 10s build/host/sdk/bin/toit run \
                  --project-root=/tmp -- \
                  tests/tcp-receive-buffer-clamp-repro.toit client "$port" \
                  > "$client_log" 2>&1
              client_result=$?
            fi
            wait "$server_pid"
            server_result=$?

            grep -h -E \
                'TOIT_TCP_READ|TCP_CLAMP_REPRO|[Ee]xception|[Ee]rror' \
                "$server_log" "$client_log" \
                | tee -a http-debug/raw-reproducer.log || true

            attempt_result="$server_result"
            if [[ "$client_result" -ne 0 ]]; then attempt_result="$client_result"; fi
            if [[ "$attempt_result" -ne 0 ]]; then
              result="$attempt_result"
              echo "Raw TCP reproducer failed on attempt $attempt with status $result" \
                  | tee -a http-debug/raw-reproducer.log
              break
            fi
          done
          set -e
          echo "$result" > http-debug/raw-result

      - name: Check out Artemis reproducer
        uses: actions/checkout@v7
        with:
          repository: toitware/artemis
          ref: ${{ inputs.artemis-ref || 'floitsch/build-artemis-service.s-new.190' }}
          path: artemis
          submodules: true

      - name: Build focused Artemis test
        shell: bash
        working-directory: artemis
        env:
          TOIT: ${{ github.workspace }}/build/host/sdk/bin/toit
          ARTEMIS_CONFIG: ${{ runner.temp }}/artemis-http-debug-config
        run: |
          make rebuild-cmake
          cmake \
              -DTOIT="$TOIT" \
              -DSLOW_TEST_TIMEOUT=${{ inputs.timeout || 180 }} \
              -DWITH_LOCAL_SUPABASE=OFF \
              -DWITH_QEMU=OFF \
              build
          make
          make download-sdk

      - name: Record runner TCP configuration
        shell: bash
        run: |
          mkdir -p http-debug
          {
            uname -a
            sysctl \
                net.core.rmem_default \
                net.core.rmem_max \
                net.ipv4.tcp_rmem \
                net.ipv4.tcp_moderate_rcvbuf \
                net.ipv4.tcp_adv_win_scale \
                net.ipv4.tcp_app_win || true
            nstat -asz | grep -E \
                'TcpExt(PruneCalled|RcvPruned|OfoPruned|TCPRcvCollapsed|TCPMemoryPressures|TCPRcvCoalesce|TCPFromZeroWindowAdv|TCPToZeroWindowAdv|TCPWantZeroWindowAdv|TCPZeroWindowDrop)' || true
          } > http-debug/runner-tcp-config.log 2>&1

      - name: Reproduce HTTP slowdown
        id: reproduce
        shell: bash
        working-directory: artemis
        env:
          TOIT_DEBUG_TCP_READ: "1"
          ATTEMPTS: ${{ inputs.attempts || 100 }}
        run: |
          mkdir -p ../http-debug

          while true; do
            date --iso-8601=ns
            ss -Htinmp state established
            sleep 0.1
          done > ../http-debug/sockets.log 2>&1 &
          socket_monitor_pid=$!

          while true; do
            date --iso-8601=ns
            nstat -asz | grep -E \
                'TcpExt(PruneCalled|RcvPruned|OfoPruned|TCPRcvCollapsed|TCPMemoryPressures|TCPRcvCoalesce|TCPFromZeroWindowAdv|TCPToZeroWindowAdv|TCPWantZeroWindowAdv|TCPZeroWindowDrop)' || true
            sleep 0.1
          done > ../http-debug/kernel-tcp.log 2>&1 &
          kernel_monitor_pid=$!

          while true; do
            date --iso-8601=ns
            cat /sys/fs/cgroup/cpu.stat
            cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory
            ps -eLo pid,ppid,tid,stat,psr,pcpu,wchan:32,comm
            sleep 1
          done > ../http-debug/system.log 2>&1 &
          system_monitor_pid=$!

          stop_monitors() {
            kill "$socket_monitor_pid" "$kernel_monitor_pid" "$system_monitor_pid" 2>/dev/null || true
            wait "$socket_monitor_pid" "$kernel_monitor_pid" "$system_monitor_pid" 2>/dev/null || true
          }
          trap stop_monitors EXIT

          result=0
          set +e
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Focused HTTP test attempt $attempt/$ATTEMPTS" \
                | tee -a ../http-debug/reproducer.log
            ctest --test-dir build/tests -C default \
                --no-tests=error \
                --verbose \
                -R '^/tests/cmd-pod-list-test-slow\.toit --http-server --http-toit-broker$' \
                2>&1 | grep --line-buffered -E \
                'TOIT_TCP_READ|HTTP (server|client)|Start [0-9]+:|Test +#[0-9]+:|Test command:|Test timeout|Timeout|FAILED|Passed|[Ee]xception|[Ee]rror' \
                | tee -a ../http-debug/reproducer.log
            result=${PIPESTATUS[0]}
            if [[ "$result" -ne 0 ]]; then
              echo "Focused HTTP test failed on attempt $attempt with status $result"
              break
            fi
          done
          set -e

          echo "$result" > ../http-debug/result
          stop_monitors
          trap - EXIT

      - name: Extract sanitized CTest timeline
        if: always()
        shell: bash
        run: |
          grep -R -h 'TOIT_TCP_READ\|HTTP server\|HTTP client' \
              artemis/build/tests/Testing/Temporary \
              > http-debug/timeline.log 2>/dev/null || true

      - name: Upload HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: http-slowdown-${{ github.run_id }}-${{ github.run_attempt }}
          path: http-debug
          if-no-files-found: error

      - name: Report reproduced failure
        if: always()
        shell: bash
        run: |
          result=$(cat http-debug/result 2>/dev/null || echo 1)
          raw_result=$(cat http-debug/raw-result 2>/dev/null || echo 1)
          if [[ "$raw_result" -ne 0 ]]; then
            echo "The minimal raw TCP slowdown/failure reproduced; inspect the uploaded timeline."
            exit "$raw_result"
          fi
          if [[ "$result" -ne 0 ]]; then
            echo "The Artemis HTTP slowdown/failure reproduced; inspect the uploaded timeline."
            exit "$result"
          fi
          echo "All raw TCP and focused Artemis attempts passed."
