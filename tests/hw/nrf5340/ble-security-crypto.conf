# Qualification configuration; not part of the default BLE image. Public Toit
# secure-connect/bonding APIs remain disabled pending pairing qualification.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_CUSTOM=y
CONFIG_TOIT_PSA_CRYPTO=y
CONFIG_TOIT_CRYPTO_EXTRA=y
CONFIG_PSA_CSPRNG_GENERATOR=y
CONFIG_BT_HOST_CRYPTO=y
CONFIG_BT_SMP=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=1
# Zephyr gates its public test vectors behind SMP debug logging. This test
# image only scans and advertises; never use this logging for real pairing.
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_SELFTEST=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_LONG_WQ_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
