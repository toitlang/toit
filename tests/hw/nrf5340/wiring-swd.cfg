# FT2232H: AD0 -> SWDCLK; AD1 via 470 ohms and AD2 directly -> SWDIO.
# No flash driver: this fixture only accesses registers and temporary RAM.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
ftdi layout_signal SWD_EN -data 0
transport select swd
adapter speed 100
reset_config none
bindto 127.0.0.1
gdb_port disabled
tcl_port 16666
telnet_port disabled
swd newdap nrf53 cpu -expected-id 0x6ba02477
dap create nrf53.dap -chain-position nrf53.cpu
target create nrf53.cpuapp cortex_m -dap nrf53.dap -ap-num 0 -defer-examine
init
nrf53.cpuapp arp_examine
